# Sólo el backend. La base de datos es externa: se le indica con DB_HOST y
# compañía, que compose lee del entorno de la shell o del .env del proyecto.
#
#   docker compose up -d --build
#
# Equivale a `docker run -e ...` con las mismas variables; ver README.md.
services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: legumexapps_tic_formatos_backend:latest
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:80"
        environment:
            APP_NAME: "${APP_NAME:-Legumexapps TIC Formatos}"
            APP_ENV: "${APP_ENV:-production}"
            APP_KEY: "${APP_KEY}"
            APP_DEBUG: "${APP_DEBUG:-false}"
            APP_URL: "${APP_URL:-http://localhost:8000}"
            APP_LOCALE: "${APP_LOCALE:-en}"
            LOG_LEVEL: "${LOG_LEVEL:-info}"
            DB_HOST: "${DB_HOST:?DB_HOST es obligatorio}"
            DB_PORT: "${DB_PORT:-5432}"
            DB_DATABASE: "${DB_DATABASE:?DB_DATABASE es obligatorio}"
            DB_USERNAME: "${DB_USERNAME:?DB_USERNAME es obligatorio}"
            DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"
            JWT_SECRET: "${JWT_SECRET}"
            ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
            ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
            ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
        volumes:
            - app_storage:/var/www/html/storage
        # Para un postgres corriendo en la máquina anfitriona usa
        # DB_HOST=host.docker.internal (en Linux hace falta esta línea).
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    app_storage:
