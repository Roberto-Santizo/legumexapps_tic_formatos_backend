      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDocumentDetailRequest'
            examples:
              default:
                summary: Equipo agregado a un documento existente
                value:
                  id: 1
                  delivery_document_id: 1
                  equipment_id: 2
                  observations: Con estuche
      responses:
        '201':
          description: Detalle creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Detalles de Documento de Entregas Creado Correctamente
                      data:
                        $ref: '#/components/schemas/DeliveryDocumentDetailRequest'
              example:
                statusCode: 201
                message: Detalles de Documento de Entregas Creado Correctamente
                data:
                  id: 1
                  delivery_document_id: 1
                  equipment_id: 2
                  observations: Con estuche
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/DeliveryDocumentDetailValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /delivery_document_details/{id}:
    get:
      tags: [Detalles de Documento de Entrega]
      summary: Obtener un detalle de documento de entrega
      description: |
        Devuelve el equipo entregado indicado, con los datos del equipo resueltos.

        Ruta: `GET /api/delivery_document_details/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showDeliveryDocumentDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Detalles de Documento de Entrega Obtenido Correctamente
                      data:
                        $ref: '#/components/schemas/DeliveryDocumentDetail'
              example:
                statusCode: 200
                message: Detalles de Documento de Entrega Obtenido Correctamente
                data:
                  id: 1
                  equipment_id: 1
                  equipment_name: Laptop Dell Latitude
                  equipment_brand: Dell
                  equipment_model: Latitude 5440
                  equipment_serie: 5CD1234XYZ
                  is_used: Nuevo
                  original: Original
                  observations: Se entrega sin cargador
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DeliveryDocumentDetailNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Detalles de Documento de Entrega]
      summary: Quitar un equipo de un documento de entrega
      description: |
        Elimina el detalle indicado. El borrado es **definitivo**: la tabla no usa
        *soft deletes*. El mensaje de éxito que devuelve hoy la aplicación es el
        mismo que el de la consulta individual.

        Ruta: `DELETE /api/delivery_document_details/{id}` — protegida por el middleware `jwt.auth`.
      operationId: deleteDeliveryDocumentDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle eliminado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Detalles de Documento de Entrega Obtenido Correctamente
                      data:
                        type: boolean
                        example: true
              example:
                statusCode: 200
                message: Detalles de Documento de Entrega Obtenido Correctamente
                data: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DeliveryDocumentDetailNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT obtenido en `POST /api/login`. Enviar como: `Authorization: Bearer <token>`'

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Nombre de usuario. Campo obligatorio.
          example: rsantizo
        password:
          type: string
          format: password
          description: Contraseña en texto plano. Campo obligatorio.
          example: secret123

    RegisterRequest:
      type: object
      required: [name, username, password, password_confirmation, role]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre completo del usuario. Obligatorio.
          example: Roberto Santizo
        username:
          type: string
          maxLength: 255
          description: Nombre de usuario para iniciar sesión. Obligatorio y único en `users.username`.
          example: rsantizo
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña en texto plano. Obligatoria, mínimo 8 caracteres. Se almacena hasheada.
          example: secret123
        password_confirmation:
          type: string
          format: password
          description: Repetición exacta de `password`. Obligatoria (regla `confirmed`).
          example: secret123
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      description: |
        Rol del usuario. Determina el acceso según los middlewares:
        - `admin`: acceso total, único rol que puede crear, listar y editar usuarios.
        - `adminagricola`: pasa el middleware `administrate_agricola`.
        - `user`: acceso básico.
      enum: [admin, adminagricola, user]
      example: user

    CreatedUser:
      type: object
      description: Datos del usuario recién creado. Nunca incluye la contraseña.
      properties:
        id:
          type: integer
          description: Identificador del usuario.
          example: 7
        name:
          type: string
          example: Roberto Santizo
        username:
          type: string
          example: rsantizo
        role:
          $ref: '#/components/schemas/Role'

    AuthenticatedUser:
      type: object
      description: Datos del usuario autenticado junto con su token JWT.
      properties:
        name:
          type: string
          description: Nombre completo del usuario.
          example: Roberto Santizo
        role:
          type: string
          description: Rol del usuario, usado por los middlewares `admin` y `administrate_agricola`.
          example: admin
        token:
          type: string
          description: JWT firmado. Expira según `JWT_TTL` (60 minutos por defecto).
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0L2FwaS9sb2dpbiJ9.4Q6bR0m1kZ2v8pXsN3tYcE7fJ9wA1dLhV5uG0oKq

    Brand:
      type: object
      description: Marca almacenada en la tabla `brands`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental de la marca.
          example: 1
        name:
          type: string
          description: Nombre de la marca. Único campo asignable en masa (`#[Fillable(['name'])]`).
          example: Legumex
        created_at:
          type: string
          format: date-time
          example: '2026-09-01T22:16:01.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-01T22:16:01.000000Z'

    BrandRequest:
      type: object
      description: Cuerpo aceptado por `POST /brands` y `PUT /brands/{id}`.
      required: [name]
      properties:
        name:
          type: string
          description: Nombre de la marca. Obligatorio (regla `required`).
          example: Legumex

    Department:
      type: object
      description: Departamento almacenado en la tabla `departments`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del departamento.
          example: 1
        name:
          type: string
          description: Nombre del departamento. Único campo asignable en masa (`#[Fillable(['name'])]`).
          example: Tecnología de la Información
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T14:15:07.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T14:15:07.000000Z'

    DepartmentRequest:
      type: object
      description: Cuerpo aceptado por `POST /departments` y `PUT /departments/{id}`.
      required: [name]
      properties:
        name:
          type: string
          description: Nombre del departamento. Obligatorio (regla `required`).
          example: Tecnología de la Información

    EquipmentType:
      type: string
      description: |
        Tipo de equipo. Corresponde al enum `App\Enums\EquipmentType`
        (declarado en `app/Enums/EquipmentType.php`).
      enum:
        - mouse
        - keyboard
        - charger
        - headset
        - webcam
        - monitor
        - laptop
        - desktop
        - printer
        - cable
        - adapter
        - other
      example: laptop

    Equipment:
      type: object
      description: |
        Equipo almacenado en la tabla `equipments`. Es la forma que devuelven
        `POST /equipments`, `GET /equipments/{id}` y `PUT /equipments/{id}`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del equipo.
          example: 1
        name:
          type: string
          description: Nombre del equipo.
          example: Laptop Dell Latitude
        model:
          type: string
          description: Modelo del equipo.
          example: Latitude 5440
        brand_id:
          type: integer
          description: Marca a la que pertenece (`brands.id`).
          example: 1
        serie:
          type: string
          description: Número de serie del equipo.
          example: 5CD1234XYZ
        original:
          type: boolean
          description: Indica si el equipo es original.
          example: true
        is_used:
          type: boolean
          description: Indica si el equipo se entregó usado.
          example: false
        type:
          $ref: '#/components/schemas/EquipmentType'
        registerdBy:
          type: integer
          description: |
            Usuario que registró el equipo (`users.id`). Lo asigna el controlador
            con el usuario del token; el nombre de la columna lleva la errata
            original de la migración.
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T17:57:39.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T17:57:39.000000Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Columna de borrado lógico de la tabla `equipments`.
          example: null

    EquipmentListItem:
      type: object
      description: |
        Vista reducida que devuelve `GET /equipments`: sustituye `brand_id` y
        `registerdBy` por los nombres relacionados.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Laptop Dell Latitude
        brand:
          type: string
          description: Nombre de la marca relacionada.
          example: Dell
        registeredBy:
          type: string
          description: Nombre del usuario que registró el equipo.
          example: Roberto Santizo

    EquipmentRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /equipments` y `PUT /equipments/{id}`
        (`App\Http\Requests\Equipment\EquipmentRequest`). Todos los campos son
        obligatorios. `registerdBy` no se acepta: lo asigna el controlador.
      required: [name, model, brand_id, serie, original, is_used, type]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre del equipo. Reglas `required|string|max:255`.
          example: Laptop Dell Latitude
        model:
          type: string
          maxLength: 255
          description: Modelo del equipo. Reglas `required|string|max:255`.
          example: Latitude 5440
        brand_id:
          type: integer
          description: Marca existente. Reglas `required|integer|exists:brands,id`.
          example: 1
        serie:
          type: string
          maxLength: 255
          description: Número de serie. Reglas `required|string|max:255`.
          example: 5CD1234XYZ
        original:
          type: boolean
          description: Reglas `required|boolean`.
          example: true
        is_used:
          type: boolean
          description: Reglas `required|boolean`.
          example: false
        type:
          allOf:
            - $ref: '#/components/schemas/EquipmentType'
          description: |
            Tipo de equipo. Reglas `required|string` más `Rule::enum(EquipmentType::class)`:
            sólo se aceptan los valores del enum.

    Caracteristic:
      type: object
      description: |
        Característica almacenada en la tabla `caracteristics`. Es la forma que
        devuelven `POST /caracteristics`, `GET /caracteristics/{id}` y
        `PUT /caracteristics/{id}`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental de la característica.
          example: 1
        name:
          type: string
          description: Nombre de la característica.
          example: Memoria RAM
        description:
          type: string
          description: Descripción de la característica.
          example: 16 GB DDR5
        equipment_id:
          type: integer
          description: Equipo al que pertenece (`equipments.id`).
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T21:06:51.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T21:06:51.000000Z'

    CaracteristicListItem:
      type: object
      description: |
        Vista reducida que devuelve `GET /caracteristics`: sustituye `equipment_id`
        por el nombre del equipo y omite la descripción.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Memoria RAM
        equipment:
          type: string
          description: Nombre del equipo relacionado.
          example: Laptop Dell Latitude

    CaracteristicRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /caracteristics` y `PUT /caracteristics/{id}`
        (`App\Http\Requests\Caracteristic\CaracteristicRequest`). Todos los campos
        son obligatorios.
      required: [name, description, equipment_id]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre de la característica. Reglas `required|string|max:255`.
          example: Memoria RAM
        description:
          type: string
          maxLength: 255
          description: Descripción de la característica. Reglas `required|string|max:255`.
          example: 16 GB DDR5
        equipment_id:
          type: integer
          description: Equipo existente. Reglas `required|integer|exists:equipments,id`.
          example: 1

    Employee:
      type: object
      description: |
        Empleado almacenado en la tabla `employees`. Es la forma que devuelven
        `GET /employees/{id}` y `PUT /employees/{id}`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del empleado.
          example: 1
        code:
          type: string
          description: Código interno del empleado.
          example: EMP-001
        name:
          type: string
          description: Nombre completo del empleado.
          example: Roberto Santizo
        department_id:
          type: integer
          description: Departamento al que pertenece (`departments.id`).
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T16:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T16:00:00.000000Z'

    EmployeeListItem:
      type: object
      description: |
        Vista reducida que devuelve `GET /employees`: sustituye `department_id` por
        el nombre del departamento y omite las marcas de tiempo.
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: EMP-001
        name:
          type: string
          example: Roberto Santizo
        department:
          type: string
          description: Nombre del departamento relacionado.
          example: Tecnología de la Información

    EmployeeRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /employees` y `PUT /employees/{id}`. A diferencia
        del resto de recursos, `EmployeeController` valida en línea con
        `$request->validate()` y no usa un FormRequest, por lo que los mensajes de
        error son los predeterminados de Laravel (en inglés). Todos los campos son
        obligatorios. También es la forma que devuelve `data` en `POST /employees`.
      required: [name, code, department_id]
      properties:
        name:
          type: string
          description: Nombre completo del empleado. Regla `required`.
          example: Roberto Santizo
        code:
          type: string
          description: Código interno del empleado. Regla `required`. No se valida su unicidad.
          example: EMP-001
        department_id:
          type: integer
          description: Departamento existente. Reglas `required|exists:departments,id`.
          example: 1

    DeliveryDocument:
      type: object
      description: |
        Documento de entrega tal como lo emite `DeliveryDocumentResource`. Es la
        forma que devuelven `GET /delivery_documents` y
        `GET /delivery_documents/{id}` (el listado usa el mismo recurso, no una
        vista reducida). Varios campos vienen ya traducidos y no coinciden con la
        columna de la tabla.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del documento.
          example: 1
        location:
          type: string
          description: |
            Planta, ya traducida: `Planta Tejar` cuando la columna `location` vale
            `1`, `Planta Parramos` en cualquier otro caso.
          example: Planta Tejar
        delivery_date:
          type: string
          description: |
            Fecha y hora de la entrega, formateada por el recurso con
            `d-m-Y h:m:s A` (no es ISO 8601).
          example: 04-09-2026 10:09:33 AM
        responsable_signature:
          type: string
          description: |
            Ruta relativa de la firma del responsable dentro del disco `public`.
          example: signatures/9f8a1c2e-4b7d-4c1a-9d2e-3f5a6b7c8d90.png
        administrador_signature:
          type: string
          description: |
            Ruta relativa de la firma del administrador dentro del disco `public`.
          example: signatures/2b7d4e6f-1a3c-4e5b-8d9f-0a1b2c3d4e5f.png
        employee_id:
          type: integer
          description: Empleado que recibe el equipo (`employees.id`).
          example: 3
        employee_name:
          type: string
          description: Nombre del empleado que recibe el equipo.
          example: Roberto Santizo
        employee_department:
          type: string
          description: Nombre del departamento del empleado (`departments.name`).
          example: Tecnología de la Información
        user_id:
          type: integer
          description: Usuario que registró la entrega, tomado del token.
          example: 1
        user_name:
          type: string
          description: Nombre del usuario que registró la entrega.
          example: Administrador
        observations:
          type: string
          nullable: true
          description: Observaciones generales de la entrega.
          example: Entrega inicial de equipo
        items:
          type: array
          description: Equipos incluidos en la entrega.
          items:
            $ref: '#/components/schemas/DeliveryDocumentDetail'

    DeliveryDocumentDetail:
      type: object
      description: |
        Equipo entregado, tal como lo emite `DeliveryDocumentDetailResource`. Es la
        forma que devuelven `GET /delivery_document_details`,
        `GET /delivery_document_details/{id}` y el arreglo `items` de
        `DeliveryDocument`. Los datos del equipo vienen aplanados desde
        `equipments` y su marca.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del detalle.
          example: 1
        equipment_id:
          type: integer
          description: |
            Equipo entregado. **Ojo**: el recurso lo llena hoy con el `id` del
            propio detalle, no con `delivery_document_details.equipment_id`.
          example: 1
        equipment_name:
          type: string
          description: Nombre del equipo (`equipments.name`).
          example: Laptop Dell Latitude
        equipment_brand:
          type: string
          description: Nombre de la marca del equipo (`brands.name`).
          example: Dell
        equipment_model:
          type: string
          description: Modelo del equipo.
          example: Latitude 5440
        equipment_serie:
          type: string
          description: Número de serie del equipo.
          example: 5CD1234XYZ
        is_used:
          type: string
          description: Estado del equipo, ya traducido a `Usado` o `Nuevo`.
          enum: [Usado, Nuevo]
          example: Nuevo
        original:
          type: string
          description: Procedencia del equipo, ya traducida a `Original` o `Copia`.
          enum: [Original, Copia]
          example: Original
        observations:
          type: string
          nullable: true
          description: Observaciones de este equipo en particular.
          example: Se entrega sin cargador

    DeliveryDocumentRequest:
      type: object
      description: |
        Cuerpo `multipart/form-data` aceptado por `POST /delivery_documents`
        (`App\Http\Requests\CreateDeliveryDocumentRequest`). Los items se envían
        con la notación de arreglo de formularios: `items[0][equipment_id]`,
        `items[0][observations]`, `items[1][equipment_id]`, …

        `user_id` y `delivery_date` los asigna el servidor y **no se aceptan aquí**.
      required: [location, responsable_signature, administrador_signature, employee_id, items]
      properties:
        location:
          type: integer
          description: |
            Planta donde se hace la entrega. Regla `required`. La columna es
            `integer`: `1` se muestra luego como `Planta Tejar` y cualquier otro
            valor como `Planta Parramos`.
          example: 1
        responsable_signature:
          type: string
          format: binary
          description: |
            Firma del responsable. Reglas
            `required|file|mimes:png,jpg,jpeg|max:2048` (2 MB). El servicio de
            almacenamiento acepta además `webp` y hasta 5 MB, pero manda la regla
            del FormRequest.
        administrador_signature:
          type: string
          format: binary
          description: |
            Firma del administrador. Reglas `required|mimes:png,jpg,jpeg|max:2048`
            (2 MB).
        employee_id:
          type: integer
          description: Empleado que recibe. Reglas `required|exists:employees,id`.
          example: 3
        observations:
          type: string
          nullable: true
          description: Observaciones generales de la entrega. Regla `nullable`.
          example: Entrega inicial de equipo
        items:
          type: array
          minItems: 1
          description: |
            Equipos entregados. Reglas `required|array|min:1`: hace falta al menos
            uno.
          items:
            type: object
            required: [equipment_id]
            properties:
              equipment_id:
                type: integer
                description: |
                  Equipo entregado. Reglas `required|exists:equipments,id`.
                example: 1
              observations:
                type: string
                nullable: true
                description: Observaciones de este equipo. Regla `nullable`.
                example: Se entrega sin cargador

    DeliveryDocumentDetailRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /delivery_document_details`
        (`App\Http\Requests\CreateDeliveryDocumentDetailRequest`), para agregar un
        equipo a un documento ya existente.
      required: [id, delivery_document_id, equipment_id]
      properties:
        id:
          type: integer
          description: |
            Regla `required`. **No se usa para nada**: `id` no es asignable en el
            modelo y la tabla lo genera sola, pero la petición falla con `422` si
            no se envía.
          example: 1
        delivery_document_id:
          type: integer
          description: |
            Documento al que pertenece. Reglas
            `required|exists:delivery_documents,id`.
          example: 1
        equipment_id:
          type: integer
          description: Equipo entregado. Reglas `required|exists:equipments,id`.
          example: 2
        observations:
          type: string
          nullable: true
          description: Observaciones de este equipo. Regla `nullable`.
          example: Con estuche

    SuccessResponse:
      type: object
      description: Envoltura estándar de respuesta exitosa (`ResponseHandler::success`).
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operación realizada correctamente
        data:
          description: Carga útil de la respuesta.
          nullable: true

    ErrorResponse:
      type: object
      description: Envoltura estándar de error (`ResponseHandler::error`).
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Credenciales inválidas
        data:
          nullable: true
          example: null

    ValidationErrorResponse:
      type: object
      description: Error de validación emitido por Laravel (`FormRequest`).
      properties:
        message:
          type: string
          example: El campo de usuario es obligatorio.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            username: ['El campo de usuario es obligatorio.']
            password: ['El campo de contraseña es obligatorio.']

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador del recurso.
      schema:
        type: integer
        example: 1

  responses:

    ValidationError:
      description: Los datos enviados no pasaron la validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    NameRequiredError:
      description: |
        El campo `name` no pasó la validación de `BrandRequest` / `DepartmentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            faltante:
              summary: No se envió name
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
            demasiadoLargo:
              summary: name supera los 255 caracteres
              value:
                message: El nombre no puede tener más de 255 caracteres.
                errors:
                  name: ['El nombre no puede tener más de 255 caracteres.']

    BrandNotFound:
      description: No existe una marca con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Marca no encontrada
            data: null

    DepartmentNotFound:
      description: No existe un departamento con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Departamento no encontrado
            data: null

    EquipmentNotFound:
      description: No existe un equipo con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Equipo no encontrado
            data: null

    CaracteristicNotFound:
      description: No existe una característica con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Característica no encontrada
            data: null

    EquipmentValidationError:
      description: |
        El cuerpo no pasó la validación de `EquipmentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
                  model: ['El campo de modelo es obligatorio.']
                  brand_id: ['El campo de marca es obligatorio.']
                  serie: ['El campo de serie es obligatorio.']
                  original: ['El campo de original es obligatorio.']
                  is_used: ['El campo de usado es obligatorio.']
                  type: ['El campo de tipo es obligatorio.']
            marcaInexistente:
              summary: brand_id no corresponde a ninguna marca
              value:
                message: La marca seleccionada no existe.
                errors:
                  brand_id: ['La marca seleccionada no existe.']
            tipoInvalido:
              summary: type fuera del enum EquipmentType
              value:
                message: El tipo de equipo seleccionado no es válido.
                errors:
                  type: ['El tipo de equipo seleccionado no es válido.']
            booleanoInvalido:
              summary: original o is_used no son booleanos
              value:
                message: El campo de original debe ser verdadero o falso.
                errors:
                  original: ['El campo de original debe ser verdadero o falso.']
                  is_used: ['El campo de usado debe ser verdadero o falso.']

    CaracteristicValidationError:
      description: |
        El cuerpo no pasó la validación de `CaracteristicRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
                  description: ['El campo de descripción es obligatorio.']
                  equipment_id: ['El campo de equipo es obligatorio.']
            equipoInexistente:
              summary: equipment_id no corresponde a ningún equipo
              value:
                message: El equipo seleccionado no existe.
                errors:
                  equipment_id: ['El equipo seleccionado no existe.']

    CaracteristicFilterError:
      description: |
        El filtro `equipmentId` no pasó la validación de
        `CaracteristicIndexRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            equipoInexistente:
              summary: equipmentId no corresponde a ningún equipo
              value:
                message: El equipo seleccionado no existe.
                errors:
                  equipmentId: ['El equipo seleccionado no existe.']
            noNumerico:
              summary: equipmentId no es un número
              value:
                message: El equipo debe ser un identificador numérico.
                errors:
                  equipmentId: ['El equipo debe ser un identificador numérico.']

    EmployeeValidationError:
      description: |
        El cuerpo no pasó la validación en línea de `EmployeeController`. Los
        mensajes son los predeterminados de Laravel porque este recurso todavía no
        usa un FormRequest con `messages()` en español.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: The name field is required. (and 2 more errors)
                errors:
                  name: ['The name field is required.']
                  code: ['The code field is required.']
                  department_id: ['The department id field is required.']
            departamentoInexistente:
              summary: department_id no corresponde a ningún departamento
              value:
                message: The selected department id is invalid.
                errors:
                  department_id: ['The selected department id is invalid.']

    DeliveryDocumentNotFound:
      description: No existe un documento de entrega con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Documento de Entrega no encontrado
            data: null

    DeliveryDocumentDetailNotFound:
      description: No existe un detalle con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Detalles de Documento de Entrega no encontrado
            data: null

    DeliveryDocumentValidationError:
      description: |
        El cuerpo no pasó la validación de `CreateDeliveryDocumentRequest`. Sólo
        `location` tiene mensaje en español (`messages()`); el resto salen con el
        texto predeterminado de Laravel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: La planta es requerida
                errors:
                  location: ['La planta es requerida']
                  responsable_signature: ['The responsable signature field is required.']
                  administrador_signature: ['The administrador signature field is required.']
                  employee_id: ['The employee id field is required.']
                  items: ['The items field is required.']
            sinItems:
              summary: Se envió items vacío
              value:
                message: The items field must have at least 1 items.
                errors:
                  items: ['The items field must have at least 1 items.']
            equipoInexistente:
              summary: Un item apunta a un equipo que no existe
              value:
                message: The selected items.0.equipment_id is invalid.
                errors:
                  items.0.equipment_id: ['The selected items.0.equipment_id is invalid.']
            firmaInvalida:
              summary: La firma no es una imagen aceptada o pesa más de 2 MB
              value:
                message: 'The responsable signature field must be a file of type: png, jpg, jpeg.'
                errors:
                  responsable_signature: ['The responsable signature field must be a file of type: png, jpg, jpeg.']

    DeliveryDocumentDetailValidationError:
      description: |
        El cuerpo no pasó la validación de `CreateDeliveryDocumentDetailRequest`.
        Este FormRequest no define `messages()`, así que los textos son los
        predeterminados de Laravel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: The id field is required. (and 2 more errors)
                errors:
                  id: ['The id field is required.']
                  delivery_document_id: ['The delivery document id field is required.']
                  equipment_id: ['The equipment id field is required.']
            documentoInexistente:
              summary: delivery_document_id no corresponde a ningún documento
              value:
                message: The selected delivery document id is invalid.
                errors:
                  delivery_document_id: ['The selected delivery document id is invalid.']

    SignatureUploadError:
      description: |
        Una de las firmas no se pudo guardar (`BadRequestError` lanzado por
        `App\Services\Storage\ImageStorageService`). Se comprueba después de la
        validación del FormRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            archivoInvalido:
              summary: La subida llegó corrupta o incompleta
              value:
                statusCode: 400
                message: El archivo enviado no es válido
                data: null
            formatoNoSoportado:
              summary: El archivo no es una imagen aceptada
              value:
                statusCode: 400
                message: El archivo debe ser una imagen JPG, PNG o WEBP
                data: null
            noSePudoGuardar:
              summary: Falló la escritura en el disco
              value:
                statusCode: 400
                message: No se pudo guardar la imagen
                data: null

    Unauthenticated:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Token not provided
          examples:
            sinToken:
              summary: No se envió la cabecera Authorization
              value:
                message: Token not provided
            expirado:
              summary: Token expirado
              value:
                message: Token has expired

    Forbidden:
      description: |
        El usuario está autenticado pero no tiene el rol requerido
        (respuesta del middleware `admin` vía `UnauthorizedError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: No autorizado
            data: null

    ServerError:
      description: Error inesperado en el servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Server Error
            data: null
