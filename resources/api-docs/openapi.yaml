openapi: 3.0.3

info:
  title: Legumex TIC Formatos API
  description: |
    Documentación de la API de Legumex TIC Formatos.

    ## Autenticación

    La API usa **JWT (JSON Web Token)** vía `tymon/jwt-auth`.

    1. Obtén un token con `POST /api/login`.
    2. Envíalo en cada petición protegida mediante la cabecera:
       `Authorization: Bearer <token>`

    El token expira según `JWT_TTL` (60 minutos por defecto).

    ## Formato de respuesta

    Todas las respuestas emitidas por la aplicación siguen la misma envoltura
    (`App\Helpers\ResponseHandler`):

    ```json
    {
      "statusCode": 200,
      "message": "Sesión Iniciada Correctamente",
      "data": {}
    }
    ```

    En caso de error, `data` es `null` y `message` contiene la descripción del fallo.
  version: 1.0.0

servers:
  # URL relativa: Swagger UI la resuelve contra el origen desde el que se abrio
  # la documentacion, asi que "Try it out" funciona igual en localhost, en una
  # VM o detras de un dominio, sin tocar el spec ni pasar por CORS.
  - url: /api
    description: Este mismo servidor
  # Alternativa para apuntar a un despliegue distinto desde el selector.
  - url: '{schema}://{host}/api'
    description: Otro servidor
    variables:
      schema:
        default: http
        enum: [http, https]
      host:
        default: localhost:8000

tags:
  - name: Auth
    description: Inicio de sesión y verificación de sesión activa
  - name: Usuarios
    description: |
      Administración de usuarios. **Todas las operaciones de creación, listado y
      edición están restringidas al rol `admin`** mediante los middlewares
      `jwt.auth` + `admin`.
  - name: Marcas
    description: |
      Catálogo de marcas (`brands`). **Todas las rutas están protegidas por el
      middleware `jwt.auth`**: exigen la cabecera `Authorization: Bearer <token>`.
      No requieren un rol específico, basta con un token válido.
  - name: Departamentos
    description: |
      Catálogo de departamentos (`departments`). **Todas las rutas están protegidas
      por el middleware `jwt.auth`**: exigen la cabecera
      `Authorization: Bearer <token>`. No requieren un rol específico, basta con un
      token válido.
  - name: Equipos
    description: |
      Inventario de equipos (`equipments`). **Todas las rutas están protegidas por
      el middleware `jwt.auth`**: exigen la cabecera
      `Authorization: Bearer <token>`. No requieren un rol específico, basta con un
      token válido. El usuario autenticado queda registrado en la columna
      `registerdBy`.
  - name: Características
    description: |
      Características asociadas a un equipo (`caracteristics`). **Todas las rutas
      están protegidas por el middleware `jwt.auth`**: exigen la cabecera
      `Authorization: Bearer <token>`. No requieren un rol específico, basta con un
      token válido.
  - name: Empleados
    description: |
      Catálogo de empleados (`employees`). **Todas las rutas están protegidas por
      el middleware `jwt.auth`**: exigen la cabecera
      `Authorization: Bearer <token>`. No requieren un rol específico, basta con un
      token válido. Cada empleado pertenece a un departamento (`departments`).
  - name: Documentos de Entrega
    description: |
      Documentos de entrega de equipo (`delivery_documents`) junto con los equipos
      que incluyen. **Todas las rutas están protegidas por el middleware
      `jwt.auth`**: exigen la cabecera `Authorization: Bearer <token>`. No
      requieren un rol específico, basta con un token válido. El usuario
      autenticado queda registrado en `user_id` y la fecha de entrega
      (`delivery_date`) la asigna el servidor: **ninguno de los dos se acepta en el
      cuerpo de la petición**.
  - name: Detalles de Documento de Entrega
    description: |
      Equipos incluidos en un documento de entrega (`delivery_document_details`).
      Lo habitual es crearlos junto al documento desde
      `POST /api/delivery_documents`; estas rutas sirven para consultarlos o para
      añadir y quitar equipos de un documento ya existente. **Todas están
      protegidas por el middleware `jwt.auth`**.
  - name: Documentos de Devolución
    description: |
      Documentos de devolución de equipo (`return_documents`) junto con los
      equipos que regresan. Una devolución siempre nace de un documento de
      entrega y puede ser **parcial**: se devuelven sólo algunos de los equipos
      entregados. **Todas las rutas están protegidas por el middleware
      `jwt.auth`**. El usuario autenticado queda registrado en `user_id` y la
      fecha (`return_date`) la asigna el servidor: **ninguno de los dos se
      acepta en el cuerpo de la petición**.
  - name: Detalles de Documento de Devolución
    description: |
      Equipos incluidos en una devolución (`return_document_details`). Cada uno
      apunta al detalle de la entrega original
      (`delivery_document_details`): sin entrega no puede haber devolución. Lo
      habitual es crearlos junto al documento desde
      `POST /api/return_documents`. **Todas están protegidas por el middleware
      `jwt.auth`**.

paths:

  /login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Valida las credenciales del usuario y devuelve un JWT junto con sus datos básicos.

        Ruta: `POST /api/login` — **no requiere autenticación**.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                summary: Credenciales válidas
                value:
                  username: rsantizo
                  password: secret123
      responses:
        '200':
          description: Sesión iniciada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Sesión Iniciada Correctamente
                      data:
                        $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                message: Credenciales inválidas
                data: null
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /register:
    post:
      tags: [Usuarios]
      summary: Registrar un usuario nuevo
      description: |
        Crea un usuario en el sistema y devuelve sus datos básicos.

        Ruta: `POST /api/register` — protegida por los middlewares `jwt.auth` + `admin`.

        **Sólo un usuario con rol `admin` puede crear usuarios.** Cualquier otro rol
        (incluido `adminagricola`) recibe `403 No autorizado`.

        La contraseña se almacena hasheada y nunca se devuelve en la respuesta.
        El endpoint **no** emite un token: el usuario creado debe iniciar sesión
        con `POST /api/login`.
      operationId: register
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                summary: Usuario estándar
                value:
                  name: Roberto Santizo
                  username: rsantizo
                  password: secret123
                  password_confirmation: secret123
                  role: user
              administrador:
                summary: Nuevo administrador
                value:
                  name: Ana López
                  username: alopez
                  password: secret123
                  password_confirmation: secret123
                  role: admin
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Usuario Creado Correctamente
                      data:
                        $ref: '#/components/schemas/CreatedUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Los datos enviados no pasaron la validación (`RegisterRequest`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                usernameDuplicado:
                  summary: El username ya existe
                  value:
                    message: El usuario ya se encuentra registrado.
                    errors:
                      username: ['El usuario ya se encuentra registrado.']
                rolInvalido:
                  summary: Rol fuera del catálogo permitido
                  value:
                    message: El rol seleccionado no es válido.
                    errors:
                      role: ['El rol seleccionado no es válido.']
                passwordSinConfirmar:
                  summary: La confirmación no coincide
                  value:
                    message: La confirmación de contraseña no coincide.
                    errors:
                      password: ['La confirmación de contraseña no coincide.']
        '500':
          $ref: '#/components/responses/ServerError'

  /check-status:
    get:
      tags: [Auth]
      summary: Verificar sesión y renovar token
      description: |
        Devuelve los datos del usuario autenticado y emite un **token nuevo** a partir
        del usuario actual. Útil para rehidratar la sesión en el cliente al recargar
        la aplicación.

        Ruta: `GET /api/check-status` — protegida por el middleware `jwt.auth`.
      operationId: checkStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Usuario Obtenido Correctamente
                      data:
                        $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

  /brands:
    get:
      tags: [Marcas]
      summary: Listar marcas
      description: |
        Devuelve todas las marcas registradas.

        Ruta: `GET /api/brands` — protegida por el middleware `jwt.auth`.
      operationId: listBrands
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marcas obtenidas correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Marcas Obtenidas Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Brand'
              example:
                statusCode: 200
                message: Marcas Obtenidas Correctamente
                data:
                  - id: 1
                    name: Legumex
                    created_at: '2026-09-01T22:16:01.000000Z'
                    updated_at: '2026-09-01T22:16:01.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Marcas]
      summary: Crear una marca
      description: |
        Crea una marca nueva y devuelve el registro completo.

        Ruta: `POST /api/brands` — protegida por el middleware `jwt.auth`.
      operationId: createBrand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
            examples:
              default:
                summary: Marca nueva
                value:
                  name: Legumex
      responses:
        '201':
          description: Marca creada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Marca Creada Correctamente
                      data:
                        $ref: '#/components/schemas/Brand'
              example:
                statusCode: 201
                message: Marca Creada Correctamente
                data:
                  id: 1
                  name: Legumex
                  created_at: '2026-09-01T22:16:01.000000Z'
                  updated_at: '2026-09-01T22:16:01.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

  /brands/{id}:
    get:
      tags: [Marcas]
      summary: Obtener una marca
      description: |
        Devuelve la marca indicada.

        Ruta: `GET /api/brands/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showBrand
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Marca obtenida correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Marca Obtenida Correctamente
                      data:
                        $ref: '#/components/schemas/Brand'
              example:
                statusCode: 200
                message: Marca Obtenida Correctamente
                data:
                  id: 1
                  name: Legumex
                  created_at: '2026-09-01T22:16:01.000000Z'
                  updated_at: '2026-09-01T22:16:01.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BrandNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Marcas]
      summary: Actualizar una marca
      description: |
        Actualiza el nombre de la marca indicada y devuelve el registro completo.

        Ruta: `PUT /api/brands/{id}` — protegida por el middleware `jwt.auth`.
      operationId: updateBrand
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
            examples:
              default:
                summary: Nuevo nombre
                value:
                  name: Legumex Premium
      responses:
        '200':
          description: Marca actualizada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Marca Actualizada Correctamente
                      data:
                        $ref: '#/components/schemas/Brand'
              example:
                statusCode: 200
                message: Marca Actualizada Correctamente
                data:
                  id: 1
                  name: Legumex Premium
                  created_at: '2026-09-01T22:16:01.000000Z'
                  updated_at: '2026-09-02T14:30:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BrandNotFound'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

  /departments:
    get:
      tags: [Departamentos]
      summary: Listar departamentos
      description: |
        Devuelve todos los departamentos registrados.

        Ruta: `GET /api/departments` — protegida por el middleware `jwt.auth`.
      operationId: listDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Departamentos obtenidos correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Departamentos Obtenidos Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Department'
              example:
                statusCode: 200
                message: Departamentos Obtenidos Correctamente
                data:
                  - id: 1
                    name: Tecnología de la Información
                    created_at: '2026-09-02T14:15:07.000000Z'
                    updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Departamentos]
      summary: Crear un departamento
      description: |
        Crea un departamento nuevo y devuelve el registro completo.

        Ruta: `POST /api/departments` — protegida por el middleware `jwt.auth`.
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
            examples:
              default:
                summary: Departamento nuevo
                value:
                  name: Tecnología de la Información
      responses:
        '201':
          description: Departamento creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Departamento Creado Correctamente
                      data:
                        $ref: '#/components/schemas/Department'
              example:
                statusCode: 201
                message: Departamento Creado Correctamente
                data:
                  id: 1
                  name: Tecnología de la Información
                  created_at: '2026-09-02T14:15:07.000000Z'
                  updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

  /departments/{id}:
    get:
      tags: [Departamentos]
      summary: Obtener un departamento
      description: |
        Devuelve el departamento indicado.

        Ruta: `GET /api/departments/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Departamento obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Departamento Obtenido Correctamente
                      data:
                        $ref: '#/components/schemas/Department'
              example:
                statusCode: 200
                message: Departamento Obtenido Correctamente
                data:
                  id: 1
                  name: Tecnología de la Información
                  created_at: '2026-09-02T14:15:07.000000Z'
                  updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DepartmentNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Departamentos]
      summary: Actualizar un departamento
      description: |
        Actualiza el nombre del departamento indicado y devuelve el registro completo.

        Ruta: `PUT /api/departments/{id}` — protegida por el middleware `jwt.auth`.
      operationId: updateDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
            examples:
              default:
                summary: Nuevo nombre
                value:
                  name: Tecnología
      responses:
        '200':
          description: Departamento actualizado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Departamento Actualizado Correctamente
                      data:
                        $ref: '#/components/schemas/Department'
              example:
                statusCode: 200
                message: Departamento Actualizado Correctamente
