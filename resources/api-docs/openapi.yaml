openapi: 3.0.3

info:
  title: Legumex TIC Formatos API
  description: |
    Documentación de la API de Legumex TIC Formatos.

    ## Autenticación

    La API usa **JWT (JSON Web Token)** vía `tymon/jwt-auth`.

    1. Obtén un token con `POST /api/login`.
    2. Envíalo en cada petición protegida mediante la cabecera:
       `Authorization: Bearer <token>`

    El token expira según `JWT_TTL` (60 minutos por defecto).

    ## Formato de respuesta

    Todas las respuestas emitidas por la aplicación siguen la misma envoltura
    (`App\Helpers\ResponseHandler`):

    ```json
    {
      "statusCode": 200,
      "message": "Sesión Iniciada Correctamente",
      "data": {}
    }
    ```

    En caso de error, `data` es `null` y `message` contiene la descripción del fallo.
  version: 1.0.0

servers:
  # URL relativa: Swagger UI la resuelve contra el origen desde el que se abrio
  # la documentacion, asi que "Try it out" funciona igual en localhost, en una
  # VM o detras de un dominio, sin tocar el spec ni pasar por CORS.
  - url: /api
    description: Este mismo servidor
  # Alternativa para apuntar a un despliegue distinto desde el selector.
  - url: '{schema}://{host}/api'
    description: Otro servidor
    variables:
      schema:
        default: http
        enum: [http, https]
      host:
        default: localhost:8000

tags:
  - name: Auth
    description: Inicio de sesión y verificación de sesión activa
  - name: Usuarios
    description: |
      Administración de usuarios. **Todas las operaciones de creación, listado y
      edición están restringidas al rol `admin`** mediante los middlewares
      `jwt.auth` + `admin`.
  - name: Marcas
    description: |
      Catálogo de marcas (`brands`). **Todas las rutas están protegidas por el
      middleware `jwt.auth`**: exigen la cabecera `Authorization: Bearer <token>`.
      No requieren un rol específico, basta con un token válido.
  - name: Departamentos
    description: |
      Catálogo de departamentos (`departments`). **Todas las rutas están protegidas
      por el middleware `jwt.auth`**: exigen la cabecera
      `Authorization: Bearer <token>`. No requieren un rol específico, basta con un
      token válido.

paths:

  /login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Valida las credenciales del usuario y devuelve un JWT junto con sus datos básicos.

        Ruta: `POST /api/login` — **no requiere autenticación**.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                summary: Credenciales válidas
                value:
                  username: rsantizo
                  password: secret123
      responses:
        '200':
          description: Sesión iniciada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Sesión Iniciada Correctamente
                      data:
                        $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                message: Credenciales inválidas
                data: null
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /register:
    post:
      tags: [Usuarios]
      summary: Registrar un usuario nuevo
      description: |
        Crea un usuario en el sistema y devuelve sus datos básicos.

        Ruta: `POST /api/register` — protegida por los middlewares `jwt.auth` + `admin`.

        **Sólo un usuario con rol `admin` puede crear usuarios.** Cualquier otro rol
        (incluido `adminagricola`) recibe `403 No autorizado`.

        La contraseña se almacena hasheada y nunca se devuelve en la respuesta.
        El endpoint **no** emite un token: el usuario creado debe iniciar sesión
        con `POST /api/login`.
      operationId: register
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                summary: Usuario estándar
                value:
                  name: Roberto Santizo
                  username: rsantizo
                  password: secret123
                  password_confirmation: secret123
                  role: user
              administrador:
                summary: Nuevo administrador
                value:
                  name: Ana López
                  username: alopez
                  password: secret123
                  password_confirmation: secret123
                  role: admin
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Usuario Creado Correctamente
                      data:
                        $ref: '#/components/schemas/CreatedUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Los datos enviados no pasaron la validación (`RegisterRequest`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                usernameDuplicado:
                  summary: El username ya existe
                  value:
                    message: El usuario ya se encuentra registrado.
                    errors:
                      username: ['El usuario ya se encuentra registrado.']
                rolInvalido:
                  summary: Rol fuera del catálogo permitido
                  value:
                    message: El rol seleccionado no es válido.
                    errors:
                      role: ['El rol seleccionado no es válido.']
                passwordSinConfirmar:
                  summary: La confirmación no coincide
                  value:
                    message: La confirmación de contraseña no coincide.
                    errors:
                      password: ['La confirmación de contraseña no coincide.']
        '500':
          $ref: '#/components/responses/ServerError'

  /check-status:
    get:
      tags: [Auth]
      summary: Verificar sesión y renovar token
      description: |
        Devuelve los datos del usuario autenticado y emite un **token nuevo** a partir
        del usuario actual. Útil para rehidratar la sesión en el cliente al recargar
        la aplicación.

        Ruta: `GET /api/check-status` — protegida por el middleware `jwt.auth`.
      operationId: checkStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Usuario Obtenido Correctamente
                      data:
                        $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

  /brands:
    get:
      tags: [Marcas]
      summary: Listar marcas
      description: |
        Devuelve todas las marcas registradas.

        Ruta: `GET /api/brands` — protegida por el middleware `jwt.auth`.
      operationId: listBrands
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marcas obtenidas correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Marcas Obtenidas Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Brand'
              example:
                statusCode: 200
                message: Marcas Obtenidas Correctamente
                data:
                  - id: 1
                    name: Legumex
                    created_at: '2026-09-01T22:16:01.000000Z'
                    updated_at: '2026-09-01T22:16:01.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Marcas]
      summary: Crear una marca
      description: |
        Crea una marca nueva y devuelve el registro completo.

        Ruta: `POST /api/brands` — protegida por el middleware `jwt.auth`.
      operationId: createBrand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
            examples:
              default:
                summary: Marca nueva
                value:
                  name: Legumex
      responses:
        '201':
          description: Marca creada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Marca Creada Correctamente
                      data:
                        $ref: '#/components/schemas/Brand'
              example:
                statusCode: 201
                message: Marca Creada Correctamente
                data:
                  id: 1
                  name: Legumex
                  created_at: '2026-09-01T22:16:01.000000Z'
                  updated_at: '2026-09-01T22:16:01.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

  /brands/{id}:
    get:
      tags: [Marcas]
      summary: Obtener una marca
      description: |
        Devuelve la marca indicada.

        Ruta: `GET /api/brands/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showBrand
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Marca obtenida correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Marca Obtenida Correctamente
                      data:
                        $ref: '#/components/schemas/Brand'
              example:
                statusCode: 200
                message: Marca Obtenida Correctamente
                data:
                  id: 1
                  name: Legumex
                  created_at: '2026-09-01T22:16:01.000000Z'
                  updated_at: '2026-09-01T22:16:01.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BrandNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Marcas]
      summary: Actualizar una marca
      description: |
        Actualiza el nombre de la marca indicada y devuelve el registro completo.

        Ruta: `PUT /api/brands/{id}` — protegida por el middleware `jwt.auth`.
      operationId: updateBrand
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
            examples:
              default:
                summary: Nuevo nombre
                value:
                  name: Legumex Premium
      responses:
        '200':
          description: Marca actualizada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Marca Actualizada Correctamente
                      data:
                        $ref: '#/components/schemas/Brand'
              example:
                statusCode: 200
                message: Marca Actualizada Correctamente
                data:
                  id: 1
                  name: Legumex Premium
                  created_at: '2026-09-01T22:16:01.000000Z'
                  updated_at: '2026-09-02T14:30:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BrandNotFound'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

  /departments:
    get:
      tags: [Departamentos]
      summary: Listar departamentos
      description: |
        Devuelve todos los departamentos registrados.

        Ruta: `GET /api/departments` — protegida por el middleware `jwt.auth`.
      operationId: listDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Departamentos obtenidos correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Departamentos Obtenidos Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Department'
              example:
                statusCode: 200
                message: Departamentos Obtenidos Correctamente
                data:
                  - id: 1
                    name: Tecnología de la Información
                    created_at: '2026-09-02T14:15:07.000000Z'
                    updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Departamentos]
      summary: Crear un departamento
      description: |
        Crea un departamento nuevo y devuelve el registro completo.

        Ruta: `POST /api/departments` — protegida por el middleware `jwt.auth`.
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
            examples:
              default:
                summary: Departamento nuevo
                value:
                  name: Tecnología de la Información
      responses:
        '201':
          description: Departamento creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Departamento Creado Correctamente
                      data:
                        $ref: '#/components/schemas/Department'
              example:
                statusCode: 201
                message: Departamento Creado Correctamente
                data:
                  id: 1
                  name: Tecnología de la Información
                  created_at: '2026-09-02T14:15:07.000000Z'
                  updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

  /departments/{id}:
    get:
      tags: [Departamentos]
      summary: Obtener un departamento
      description: |
        Devuelve el departamento indicado.

        Ruta: `GET /api/departments/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Departamento obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Departamento Obtenido Correctamente
                      data:
                        $ref: '#/components/schemas/Department'
              example:
                statusCode: 200
                message: Departamento Obtenido Correctamente
                data:
                  id: 1
                  name: Tecnología de la Información
                  created_at: '2026-09-02T14:15:07.000000Z'
                  updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DepartmentNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Departamentos]
      summary: Actualizar un departamento
      description: |
        Actualiza el nombre del departamento indicado y devuelve el registro completo.

        Ruta: `PUT /api/departments/{id}` — protegida por el middleware `jwt.auth`.
      operationId: updateDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
            examples:
              default:
                summary: Nuevo nombre
                value:
                  name: Tecnología
      responses:
        '200':
          description: Departamento actualizado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Departamento Actualizado Correctamente
                      data:
                        $ref: '#/components/schemas/Department'
              example:
                statusCode: 200
                message: Departamento Actualizado Correctamente
                data:
                  id: 1
                  name: Tecnología
                  created_at: '2026-09-02T14:15:07.000000Z'
                  updated_at: '2026-09-02T15:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/DepartmentNotFound'
        '422':
          $ref: '#/components/responses/NameRequiredError'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT obtenido en `POST /api/login`. Enviar como: `Authorization: Bearer <token>`'

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Nombre de usuario. Campo obligatorio.
          example: rsantizo
        password:
          type: string
          format: password
          description: Contraseña en texto plano. Campo obligatorio.
          example: secret123

    RegisterRequest:
      type: object
      required: [name, username, password, password_confirmation, role]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre completo del usuario. Obligatorio.
          example: Roberto Santizo
        username:
          type: string
          maxLength: 255
          description: Nombre de usuario para iniciar sesión. Obligatorio y único en `users.username`.
          example: rsantizo
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña en texto plano. Obligatoria, mínimo 8 caracteres. Se almacena hasheada.
          example: secret123
        password_confirmation:
          type: string
          format: password
          description: Repetición exacta de `password`. Obligatoria (regla `confirmed`).
          example: secret123
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      description: |
        Rol del usuario. Determina el acceso según los middlewares:
        - `admin`: acceso total, único rol que puede crear, listar y editar usuarios.
        - `adminagricola`: pasa el middleware `administrate_agricola`.
        - `user`: acceso básico.
      enum: [admin, adminagricola, user]
      example: user

    CreatedUser:
      type: object
      description: Datos del usuario recién creado. Nunca incluye la contraseña.
      properties:
        id:
          type: integer
          description: Identificador del usuario.
          example: 7
        name:
          type: string
          example: Roberto Santizo
        username:
          type: string
          example: rsantizo
        role:
          $ref: '#/components/schemas/Role'

    AuthenticatedUser:
      type: object
      description: Datos del usuario autenticado junto con su token JWT.
      properties:
        name:
          type: string
          description: Nombre completo del usuario.
          example: Roberto Santizo
        role:
          type: string
          description: Rol del usuario, usado por los middlewares `admin` y `administrate_agricola`.
          example: admin
        token:
          type: string
          description: JWT firmado. Expira según `JWT_TTL` (60 minutos por defecto).
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0L2FwaS9sb2dpbiJ9.4Q6bR0m1kZ2v8pXsN3tYcE7fJ9wA1dLhV5uG0oKq

    Brand:
      type: object
      description: Marca almacenada en la tabla `brands`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental de la marca.
          example: 1
        name:
          type: string
          description: Nombre de la marca. Único campo asignable en masa (`#[Fillable(['name'])]`).
          example: Legumex
        created_at:
          type: string
          format: date-time
          example: '2026-09-01T22:16:01.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-01T22:16:01.000000Z'

    BrandRequest:
      type: object
      description: Cuerpo aceptado por `POST /brands` y `PUT /brands/{id}`.
      required: [name]
      properties:
        name:
          type: string
          description: Nombre de la marca. Obligatorio (regla `required`).
          example: Legumex

    Department:
      type: object
      description: Departamento almacenado en la tabla `departments`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del departamento.
          example: 1
        name:
          type: string
          description: Nombre del departamento. Único campo asignable en masa (`#[Fillable(['name'])]`).
          example: Tecnología de la Información
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T14:15:07.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T14:15:07.000000Z'

    DepartmentRequest:
      type: object
      description: Cuerpo aceptado por `POST /departments` y `PUT /departments/{id}`.
      required: [name]
      properties:
        name:
          type: string
          description: Nombre del departamento. Obligatorio (regla `required`).
          example: Tecnología de la Información

    SuccessResponse:
      type: object
      description: Envoltura estándar de respuesta exitosa (`ResponseHandler::success`).
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operación realizada correctamente
        data:
          description: Carga útil de la respuesta.
          nullable: true

    ErrorResponse:
      type: object
      description: Envoltura estándar de error (`ResponseHandler::error`).
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Credenciales inválidas
        data:
          nullable: true
          example: null

    ValidationErrorResponse:
      type: object
      description: Error de validación emitido por Laravel (`FormRequest`).
      properties:
        message:
          type: string
          example: El campo de usuario es obligatorio.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            username: ['El campo de usuario es obligatorio.']
            password: ['El campo de contraseña es obligatorio.']

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador del recurso.
      schema:
        type: integer
        example: 1

  responses:

    ValidationError:
      description: Los datos enviados no pasaron la validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    NameRequiredError:
      description: |
        El campo `name` no pasó la validación de `BrandRequest` / `DepartmentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            faltante:
              summary: No se envió name
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
            demasiadoLargo:
              summary: name supera los 255 caracteres
              value:
                message: El nombre no puede tener más de 255 caracteres.
                errors:
                  name: ['El nombre no puede tener más de 255 caracteres.']

    BrandNotFound:
      description: No existe una marca con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Marca no encontrada
            data: null

    DepartmentNotFound:
      description: No existe un departamento con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Departamento no encontrado
            data: null

    Unauthenticated:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Token not provided
          examples:
            sinToken:
              summary: No se envió la cabecera Authorization
              value:
                message: Token not provided
            expirado:
              summary: Token expirado
              value:
                message: Token has expired

    Forbidden:
      description: |
        El usuario está autenticado pero no tiene el rol requerido
        (respuesta del middleware `admin` vía `UnauthorizedError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: No autorizado
            data: null

    ServerError:
      description: Error inesperado en el servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Server Error
            data: null
