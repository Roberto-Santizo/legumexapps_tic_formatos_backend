              example:
                statusCode: 200
                message: Departamentos Obtenidos Correctamente
                data:
                  - id: 1
                    name: Tecnología de la Información
                    created_at: '2026-09-02T14:15:07.000000Z'
                    updated_at: '2026-09-02T14:15:07.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
