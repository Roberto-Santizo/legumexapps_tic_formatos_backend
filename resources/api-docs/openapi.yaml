      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 406
            message: No se puede eliminar un empleado que tiene equipo asignado
            data: null

    EmployeeCodeValidationError:
      description: |
