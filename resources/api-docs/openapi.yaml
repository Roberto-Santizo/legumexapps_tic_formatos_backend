      description: |
        Elimina el documento indicado. Sus detalles se borran en cascada
        (`delivery_document_details.delivery_document_id` está definida con
        `cascadeOnDelete`). El borrado es **definitivo**: la tabla no usa
        *soft deletes*.

        Ruta: `DELETE /api/delivery_documents/{id}` — protegida por el middleware `jwt.auth`.
      operationId: deleteDeliveryDocument
