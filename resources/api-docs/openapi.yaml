            data: null

    NotAcceptableReturnDocument:
      description: |
        RN-11: la entrega ya fue devuelta por completo (`NotAcceptable`). Es la
        última defensa: normalmente RN-10 rechaza antes cada detalle con un `422`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 406
            message: El documento de entrega ya fue devuelto por completo
            data: null

    NotAcceptableEquipmentUpdate:
      description: |
