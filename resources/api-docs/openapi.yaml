  /return_documents:
    get:
      tags: [Documentos de Devolución]
      summary: Listar documentos de devolución
      description: |
        Devuelve las devoluciones registradas, de la más reciente a la más
        antigua, con el documento de entrega del que provienen, el empleado (que
        se lee a través de esa entrega) y el arreglo `items` con los equipos
        devueltos.

        Ruta: `GET /api/return_documents` — protegida por el middleware `jwt.auth`.
      operationId: listReturnDocuments
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryDocumentId
          in: query
          required: false
          description: Filtra las devoluciones de un documento de entrega.
          schema:
            type: integer
            example: 1
        - name: employeeId
          in: query
          required: false
          description: |
            Filtra por el empleado del documento de entrega relacionado.
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Devoluciones obtenidas correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Devolución de Documentos Obtenidos Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReturnDocument'
              example:
                statusCode: 200
                message: Devolución de Documentos Obtenidos Correctamente
                data:
                  - id: 1
                    return_date: 06-09-2026 09:15:02 AM
                    responsable_signature: signatures/7c1e9d4a-5b2f-4e8a-9c3d-1f2a3b4c5d6e.png
                    administrador_signature: signatures/8d2f0e5b-6c3a-4f9b-8d4e-2a3b4c5d6e7f.png
                    employee_id: 3
                    employee_name: Roberto Santizo
                    employee_department: Tecnología de la Información
                    location: Planta Tejar
                    observations: Devuelve únicamente el mouse
                    delivery_document_id: 1
                    delivery_document_status: parcial
                    user_id: 1
                    user_name: Administrador
                    items:
                      - id: 1
                        return_document_id: 1
                        delivery_document_detail_id: 2
                        equipment_id: 2
                        equipment_name: Mouse Dell
                        equipment_brand: Dell
                        equipment_model: MS116
                        equipment_serie: MS1234XYZ
                        equipment_type: mouse
                        is_used: Nuevo
                        original: Original
                        observations: Regresa en buen estado
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ReturnDocumentFilterError'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Documentos de Devolución]
      summary: Crear un documento de devolución con sus equipos
      description: |
        Crea la devolución **y sus detalles en una sola petición**, dentro de una
        transacción. La devolución puede ser **parcial**: se envían sólo los
        equipos que regresan, y los demás siguen asignados al empleado.

        Cada item apunta al detalle de la entrega original
        (`delivery_document_detail_id`, que se obtiene de
        `GET /api/delivery_documents/{id}/pending_items`): sin entrega no puede
        haber devolución.

        El cuerpo se envía como `multipart/form-data` porque incluye las dos
        firmas como archivo:

        ```
        delivery_document_id=1
        observations=Devuelve únicamente el mouse
        responsable_signature=<archivo>
        administrador_signature=<archivo>
        items[0][delivery_document_detail_id]=2
        items[0][observations]=Regresa en buen estado
        ```

        `user_id` se toma del token y `return_date` de la hora del servidor;
        **no se aceptan en el cuerpo**. La creación **no devuelve el documento**:
        `data` es `true`. Usa `GET /api/return_documents/{id}` para leerlo.

        Ruta: `POST /api/return_documents` — protegida por el middleware `jwt.auth`.
      operationId: createReturnDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnDocumentRequest'
            encoding:
              responsable_signature:
                contentType: image/png, image/jpeg
              administrador_signature:
                contentType: image/png, image/jpeg
      responses:
        '201':
          description: Devolución creada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Devolución de Documento Creado Correctamente
                      data:
                        type: boolean
                        example: true
              example:
                statusCode: 201
                message: Devolución de Documento Creado Correctamente
                data: true
        '400':
          $ref: '#/components/responses/SignatureUploadError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptableReturnDocument'
        '422':
          $ref: '#/components/responses/ReturnDocumentValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /return_documents/{id}:
    get:
      tags: [Documentos de Devolución]
      summary: Obtener un documento de devolución
      description: |
        Devuelve la devolución indicada con su arreglo `items` y el estado en que
        quedó la entrega relacionada (`delivery_document_status`).

        Ruta: `GET /api/return_documents/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showReturnDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Devolución obtenida correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Devolución de Documento Obtenido Correctamente
                      data:
                        $ref: '#/components/schemas/ReturnDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReturnDocumentNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Documentos de Devolución]
      summary: Corregir las observaciones de una devolución
      description: |
        De una devolución ya firmada **sólo se corrigen las observaciones**: las
        firmas, la fecha y el documento de entrega relacionado quedan fijos. Para
        cambiar los equipos devueltos se usan las rutas de
        `/return_document_details`.

        Ruta: `PUT /api/return_documents/{id}` — protegida por el middleware `jwt.auth`.
      operationId: updateReturnDocument
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationsRequest'
      responses:
        '200':
          description: Devolución actualizada correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Devolución de Documento Actualizado Correctamente
                      data:
                        $ref: '#/components/schemas/ReturnDocument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReturnDocumentNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /return_document_details:
    get:
      tags: [Detalles de Documento de Devolución]
      summary: Listar detalles de devolución
      description: |
        Devuelve los equipos devueltos con sus datos ya resueltos a través del
        detalle de entrega del que provienen. Acepta el filtro opcional
        `returnDocumentId`.

        Ruta: `GET /api/return_document_details` — protegida por el middleware `jwt.auth`.
      operationId: listReturnDocumentDetails
      security:
        - bearerAuth: []
      parameters:
        - name: returnDocumentId
          in: query
          required: false
          description: Filtra los equipos de una devolución concreta.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Detalles obtenidos correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Detalles de Devolución de Documentos Obtenidos Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReturnDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Detalles de Documento de Devolución]
      summary: Agregar un equipo a una devolución existente
      description: |
        Registra la devolución de un equipo más sobre una devolución ya creada.
        Lo habitual es enviarlos todos desde `POST /api/return_documents`; esta
        ruta sirve para completar un documento ya firmado.

        Ruta: `POST /api/return_document_details` — protegida por el middleware `jwt.auth`.
      operationId: createReturnDocumentDetail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnDocumentDetailRequest'
      responses:
        '201':
          description: Detalle creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Detalles de Devolución de Documentos Creados Correctamente
                      data:
                        $ref: '#/components/schemas/ReturnDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ReturnDocumentDetailValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /return_document_details/{id}:
    get:
      tags: [Detalles de Documento de Devolución]
      summary: Obtener un detalle de devolución
      description: |
        Ruta: `GET /api/return_document_details/{id}` — protegida por el middleware `jwt.auth`.
      operationId: showReturnDocumentDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Detalle obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Detalles de Devolución de Documento Obtenidos Correctamente
                      data:
                        $ref: '#/components/schemas/ReturnDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReturnDocumentDetailNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Detalles de Documento de Devolución]
      summary: Corregir las observaciones de un equipo devuelto
      description: |
        Sólo se corrigen las observaciones: mover el equipo a otra entrega o a
        otra devolución equivale a rehacer el registro.

        Ruta: `PUT /api/return_document_details/{id}` — protegida por el middleware `jwt.auth`.
      operationId: updateReturnDocumentDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationsRequest'
      responses:
        '200':
          description: Detalle actualizado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Detalles de Devolución de Documento Actualizados Correctamente
                      data:
                        $ref: '#/components/schemas/ReturnDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ReturnDocumentDetailNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT obtenido en `POST /api/login`. Enviar como: `Authorization: Bearer <token>`'

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Nombre de usuario. Campo obligatorio.
          example: rsantizo
        password:
          type: string
          format: password
          description: Contraseña en texto plano. Campo obligatorio.
          example: secret123

    RegisterRequest:
      type: object
      required: [name, username, password, password_confirmation, role]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre completo del usuario. Obligatorio.
          example: Roberto Santizo
        username:
          type: string
          maxLength: 255
          description: Nombre de usuario para iniciar sesión. Obligatorio y único en `users.username`.
          example: rsantizo
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña en texto plano. Obligatoria, mínimo 8 caracteres. Se almacena hasheada.
          example: secret123
        password_confirmation:
          type: string
          format: password
          description: Repetición exacta de `password`. Obligatoria (regla `confirmed`).
          example: secret123
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      description: |
        Rol del usuario. Determina el acceso según los middlewares:
        - `admin`: acceso total, único rol que puede crear, listar y editar usuarios.
        - `adminagricola`: pasa el middleware `administrate_agricola`.
        - `user`: acceso básico.
      enum: [admin, adminagricola, user]
      example: user

    CreatedUser:
      type: object
      description: Datos del usuario recién creado. Nunca incluye la contraseña.
      properties:
        id:
          type: integer
          description: Identificador del usuario.
          example: 7
        name:
          type: string
          example: Roberto Santizo
        username:
          type: string
          example: rsantizo
        role:
          $ref: '#/components/schemas/Role'

    AuthenticatedUser:
      type: object
      description: Datos del usuario autenticado junto con su token JWT.
      properties:
        name:
          type: string
          description: Nombre completo del usuario.
          example: Roberto Santizo
        role:
          type: string
          description: Rol del usuario, usado por los middlewares `admin` y `administrate_agricola`.
          example: admin
        token:
          type: string
          description: JWT firmado. Expira según `JWT_TTL` (60 minutos por defecto).
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0L2FwaS9sb2dpbiJ9.4Q6bR0m1kZ2v8pXsN3tYcE7fJ9wA1dLhV5uG0oKq

    Brand:
      type: object
      description: Marca almacenada en la tabla `brands`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental de la marca.
          example: 1
        name:
          type: string
          description: Nombre de la marca. Único campo asignable en masa (`#[Fillable(['name'])]`).
          example: Legumex
        created_at:
          type: string
          format: date-time
          example: '2026-09-01T22:16:01.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-01T22:16:01.000000Z'

    BrandRequest:
      type: object
      description: Cuerpo aceptado por `POST /brands` y `PUT /brands/{id}`.
      required: [name]
      properties:
        name:
          type: string
          description: Nombre de la marca. Obligatorio (regla `required`).
          example: Legumex

    Department:
      type: object
      description: Departamento almacenado en la tabla `departments`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del departamento.
          example: 1
        name:
          type: string
          description: Nombre del departamento. Único campo asignable en masa (`#[Fillable(['name'])]`).
          example: Tecnología de la Información
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T14:15:07.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T14:15:07.000000Z'

    DepartmentRequest:
      type: object
      description: Cuerpo aceptado por `POST /departments` y `PUT /departments/{id}`.
      required: [name]
      properties:
        name:
          type: string
          description: Nombre del departamento. Obligatorio (regla `required`).
          example: Tecnología de la Información

    EquipmentType:
      type: string
      description: |
        Tipo de equipo. Corresponde al enum `App\Enums\EquipmentType`
        (declarado en `app/Enums/EquipmentType.php`).
      enum:
        - mouse
        - keyboard
        - charger
        - headset
        - webcam
        - monitor
        - laptop
        - desktop
        - printer
        - phone
        - cable
        - adapter
        - other
      example: laptop

    Equipment:
      type: object
      description: |
        Equipo almacenado en la tabla `equipments`. Es la forma que devuelven
        `POST /equipments`, `GET /equipments/{id}` y `PUT /equipments/{id}`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del equipo.
          example: 1
        name:
          type: string
          description: Nombre del equipo.
          example: Laptop Dell Latitude
        model:
          type: string
          description: Modelo del equipo.
          example: Latitude 5440
        brand_id:
          type: integer
          description: Marca a la que pertenece (`brands.id`).
          example: 1
        serie:
          type: string
          description: Número de serie del equipo.
          example: 5CD1234XYZ
        original:
          type: boolean
          description: Indica si el equipo es original.
          example: true
        is_used:
          type: boolean
          description: Indica si el equipo se entregó usado.
          example: false
        type:
          $ref: '#/components/schemas/EquipmentType'
        registerdBy:
          type: integer
          description: |
            Usuario que registró el equipo (`users.id`). Lo asigna el controlador
            con el usuario del token; el nombre de la columna lleva la errata
            original de la migración.
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T17:57:39.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T17:57:39.000000Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Columna de borrado lógico de la tabla `equipments`.
          example: null

    EquipmentListItem:
      type: object
      description: |
        Vista reducida que devuelven `GET /equipments` y
        `GET /equipments/available`: sustituye `brand_id` y `registerdBy` por los
        nombres relacionados y agrega si el equipo está asignado.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Laptop Dell Latitude
        brand:
          type: string
          description: Nombre de la marca relacionada.
          example: Dell
        registeredBy:
          type: string
          description: Nombre del usuario que registró el equipo.
          example: Roberto Santizo
        original:
          type: string
          description: |
            Procedencia del equipo. **Ojo**: el recurso traduce el booleano
            `original` a `Nuevo` / `Usado`, no a `Original` / `Copia`.
          enum: [Nuevo, Usado]
          example: Nuevo
        isAssigned:
          type: boolean
          description: |
            `true` si el equipo tiene una entrega activa: su último detalle de
            entrega todavía no tiene devolución. `GET /equipments/available`
            devuelve únicamente equipos con `false`.
          example: false

    EquipmentRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /equipments` y `PUT /equipments/{id}`
        (`App\Http\Requests\Equipment\EquipmentRequest`). Todos los campos son
        obligatorios. `registerdBy` no se acepta: lo asigna el controlador.
      required: [name, model, brand_id, serie, original, is_used, type]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre del equipo. Reglas `required|string|max:255`.
          example: Laptop Dell Latitude
        model:
          type: string
          maxLength: 255
          description: Modelo del equipo. Reglas `required|string|max:255`.
          example: Latitude 5440
        brand_id:
          type: integer
          description: Marca existente. Reglas `required|integer|exists:brands,id`.
          example: 1
        serie:
          type: string
          maxLength: 255
          description: Número de serie. Reglas `required|string|max:255`.
          example: 5CD1234XYZ
        original:
          type: boolean
          description: Reglas `required|boolean`.
          example: true
        is_used:
          type: boolean
          description: Reglas `required|boolean`.
          example: false
        type:
          allOf:
            - $ref: '#/components/schemas/EquipmentType'
          description: |
            Tipo de equipo. Reglas `required|string` más `Rule::enum(EquipmentType::class)`:
            sólo se aceptan los valores del enum.

    Caracteristic:
      type: object
      description: |
        Característica almacenada en la tabla `caracteristics`. Es la forma que
        devuelven `POST /caracteristics`, `GET /caracteristics/{id}` y
        `PUT /caracteristics/{id}`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental de la característica.
          example: 1
        name:
          type: string
          description: Nombre de la característica.
          example: Memoria RAM
        description:
          type: string
          description: Descripción de la característica.
          example: 16 GB DDR5
        equipment_id:
          type: integer
          description: Equipo al que pertenece (`equipments.id`).
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T21:06:51.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T21:06:51.000000Z'

    CaracteristicListItem:
      type: object
      description: |
        Vista reducida que devuelve `GET /caracteristics`: sustituye `equipment_id`
        por el nombre del equipo y omite la descripción.
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Memoria RAM
        equipment:
          type: string
          description: Nombre del equipo relacionado.
          example: Laptop Dell Latitude

    CaracteristicRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /caracteristics` y `PUT /caracteristics/{id}`
        (`App\Http\Requests\Caracteristic\CaracteristicRequest`). Todos los campos
        son obligatorios.
      required: [name, description, equipment_id]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nombre de la característica. Reglas `required|string|max:255`.
          example: Memoria RAM
        description:
          type: string
          maxLength: 255
          description: Descripción de la característica. Reglas `required|string|max:255`.
          example: 16 GB DDR5
        equipment_id:
          type: integer
          description: Equipo existente. Reglas `required|integer|exists:equipments,id`.
          example: 1

    Employee:
      type: object
      description: |
        Empleado almacenado en la tabla `employees`. Es la forma que devuelven
        `GET /employees/{id}` y `PUT /employees/{id}`.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del empleado.
          example: 1
        code:
          type: string
          description: Código interno del empleado.
          example: EMP-001
        name:
          type: string
          description: Nombre completo del empleado.
          example: Roberto Santizo
        department_id:
          type: integer
          description: Departamento al que pertenece (`departments.id`).
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T16:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T16:00:00.000000Z'

    EmployeeListItem:
      type: object
      description: |
        Vista reducida que devuelve `GET /employees`: sustituye `department_id` por
        el nombre del departamento y omite las marcas de tiempo.
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: EMP-001
        name:
          type: string
          example: Roberto Santizo
        department:
          type: string
          description: Nombre del departamento relacionado.
          example: Tecnología de la Información

    EmployeeRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /employees` y `PUT /employees/{id}`. A diferencia
        del resto de recursos, `EmployeeController` valida en línea con
        `$request->validate()` y no usa un FormRequest, por lo que los mensajes de
        error son los predeterminados de Laravel (en inglés). Todos los campos son
        obligatorios. También es la forma que devuelve `data` en `POST /employees`.
      required: [name, code, department_id]
      properties:
        name:
          type: string
          description: Nombre completo del empleado. Regla `required`.
          example: Roberto Santizo
        code:
          type: string
          description: Código interno del empleado. Regla `required`. No se valida su unicidad.
          example: EMP-001
        department_id:
          type: integer
          description: Departamento existente. Reglas `required|exists:departments,id`.
          example: 1

    DeliveryDocument:
      type: object
      description: |
        Documento de entrega tal como lo emite `DeliveryDocumentResource`. Es la
        forma que devuelven `GET /delivery_documents` y
        `GET /delivery_documents/{id}` (el listado usa el mismo recurso, no una
        vista reducida). Varios campos vienen ya traducidos y no coinciden con la
        columna de la tabla.
      properties:
        id:
          type: integer
          description: Identificador autoincremental del documento.
          example: 1
        location:
          type: string
          description: |
            Planta, ya traducida: `Planta Tejar` cuando la columna `location` vale
            `1`, `Planta Parramos` en cualquier otro caso.
          example: Planta Tejar
        delivery_date:
          type: string
          description: |
            Fecha y hora de la entrega, formateada por el recurso con
            `d-m-Y h:m:s A` (no es ISO 8601).
          example: 04-09-2026 10:09:33 AM
        responsable_signature:
          type: string
          description: |
            Ruta relativa de la firma del responsable dentro del disco `public`.
          example: signatures/9f8a1c2e-4b7d-4c1a-9d2e-3f5a6b7c8d90.png
        administrador_signature:
          type: string
          description: |
            Ruta relativa de la firma del administrador dentro del disco `public`.
          example: signatures/2b7d4e6f-1a3c-4e5b-8d9f-0a1b2c3d4e5f.png
        employee_id:
          type: integer
          description: Empleado que recibe el equipo (`employees.id`).
          example: 3
        employee_name:
          type: string
          description: Nombre del empleado que recibe el equipo.
          example: Roberto Santizo
        employee_department:
          type: string
          description: Nombre del departamento del empleado (`departments.name`).
          example: Tecnología de la Información
        user_id:
          type: integer
          description: Usuario que registró la entrega, tomado del token.
          example: 1
        user_name:
          type: string
          description: Nombre del usuario que registró la entrega.
          example: Administrador
        observations:
          type: string
          nullable: true
          description: Observaciones generales de la entrega.
          example: Entrega inicial de equipo
        status:
          type: string
          description: |
            Estado de la entrega, calculado sobre sus detalles: `pendiente` (no
            se ha devuelto nada), `parcial` (se devolvió parte) o `devuelto`
            (regresó todo).
          enum: [pendiente, parcial, devuelto]
          example: pendiente
        items_count:
          type: integer
          description: Cantidad de equipos incluidos en la entrega.
          example: 2
        pending_items_count:
          type: integer
          description: Cantidad de equipos que aún no se devuelven.
          example: 2
        items:
          type: array
          description: Equipos incluidos en la entrega.
          items:
            $ref: '#/components/schemas/DeliveryDocumentDetail'

    DeliveryDocumentDetail:
      type: object
      description: |
        Equipo entregado, tal como lo emite `DeliveryDocumentDetailResource`. Es la
        forma que devuelven `GET /delivery_document_details`,
        `GET /delivery_document_details/{id}` y el arreglo `items` de
        `DeliveryDocument`. Los datos del equipo vienen aplanados desde
        `equipments` y su marca.
      properties:
        id:
          type: integer
          description: |
            Identificador autoincremental del detalle. Es el valor que se envía
            como `delivery_document_detail_id` al registrar la devolución.
          example: 1
        delivery_document_id:
          type: integer
          description: Documento de entrega al que pertenece el detalle.
          example: 1
        equipment_id:
          type: integer
          description: Equipo entregado (`delivery_document_details.equipment_id`).
          example: 1
        equipment_name:
          type: string
          description: Nombre del equipo (`equipments.name`).
          example: Laptop Dell Latitude
        equipment_brand:
          type: string
          description: Nombre de la marca del equipo (`brands.name`).
          example: Dell
        equipment_model:
          type: string
          description: Modelo del equipo.
          example: Latitude 5440
        equipment_serie:
          type: string
          description: Número de serie del equipo.
          example: 5CD1234XYZ
        equipment_type:
          allOf:
            - $ref: '#/components/schemas/EquipmentType'
          description: Tipo del equipo (`equipments.type`).
        is_used:
          type: string
          description: Estado del equipo, ya traducido a `Usado` o `Nuevo`.
          enum: [Usado, Nuevo]
          example: Nuevo
        original:
          type: string
          description: Procedencia del equipo, ya traducida a `Original` o `Copia`.
          enum: [Original, Copia]
          example: Original
        observations:
          type: string
          nullable: true
          description: Observaciones de este equipo en particular.
          example: Se entrega sin cargador
        returned:
          type: boolean
          description: |
            `true` cuando el detalle ya tiene su `return_document_details`.
            Mientras sea `false` el equipo sigue asignado al empleado.
          example: false
        return_document_id:
          type: integer
          nullable: true
          description: Devolución en la que regresó el equipo, si ya ocurrió.
          example: null

    DeliveryDocumentRequest:
      type: object
      description: |
        Cuerpo `multipart/form-data` aceptado por `POST /delivery_documents`
        (`App\Http\Requests\CreateDeliveryDocumentRequest`). Los items se envían
        con la notación de arreglo de formularios: `items[0][equipment_id]`,
        `items[0][observations]`, `items[1][equipment_id]`, …

        `user_id` y `delivery_date` los asigna el servidor y **no se aceptan aquí**.
      required: [location, responsable_signature, administrador_signature, employee_id, items]
      properties:
        location:
          type: integer
          description: |
            Planta donde se hace la entrega. Regla `required`. La columna es
            `integer`: `1` se muestra luego como `Planta Tejar` y cualquier otro
            valor como `Planta Parramos`.
          example: 1
        responsable_signature:
          type: string
          format: binary
          description: |
            Firma del responsable. Reglas
            `required|file|mimes:png,jpg,jpeg|max:2048` (2 MB). El servicio de
            almacenamiento acepta además `webp` y hasta 5 MB, pero manda la regla
            del FormRequest.
        administrador_signature:
          type: string
          format: binary
          description: |
            Firma del administrador. Reglas `required|mimes:png,jpg,jpeg|max:2048`
            (2 MB).
        employee_id:
          type: integer
          description: Empleado que recibe. Reglas `required|exists:employees,id`.
          example: 3
        observations:
          type: string
          nullable: true
          description: Observaciones generales de la entrega. Regla `nullable`.
          example: Entrega inicial de equipo
        items:
          type: array
          minItems: 1
          description: |
            Equipos entregados. Reglas `required|array|min:1`: hace falta al menos
            uno.
          items:
            type: object
            required: [equipment_id]
            properties:
              equipment_id:
                type: integer
                description: |
                  Equipo entregado. Reglas `required|exists:equipments,id`.
                example: 1
              observations:
                type: string
                nullable: true
                description: Observaciones de este equipo. Regla `nullable`.
                example: Se entrega sin cargador

    DeliveryDocumentDetailRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /delivery_document_details`
        (`App\Http\Requests\CreateDeliveryDocumentDetailRequest`), para agregar un
        equipo a un documento ya existente.
      required: [delivery_document_id, equipment_id]
      properties:
        delivery_document_id:
          type: integer
          description: |
            Documento al que pertenece. Reglas
            `required|exists:delivery_documents,id`.
          example: 1
        equipment_id:
          type: integer
          description: Equipo entregado. Reglas `required|exists:equipments,id`.
          example: 2
        observations:
          type: string
          nullable: true
          description: Observaciones de este equipo. Regla `nullable`.
          example: Con estuche

    SuccessResponse:
      type: object
      description: Envoltura estándar de respuesta exitosa (`ResponseHandler::success`).
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operación realizada correctamente
        data:
          description: Carga útil de la respuesta.
          nullable: true

    ErrorResponse:
      type: object
      description: Envoltura estándar de error (`ResponseHandler::error`).
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Credenciales inválidas
        data:
          nullable: true
          example: null

    ValidationErrorResponse:
      type: object
      description: Error de validación emitido por Laravel (`FormRequest`).
      properties:
        message:
          type: string
          example: El campo de usuario es obligatorio.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            username: ['El campo de usuario es obligatorio.']
            password: ['El campo de contraseña es obligatorio.']

    Assignment:
      type: object
      description: |
        Asignación de un equipo, tal como la emite `AssignmentResource`: un
        `delivery_document_details` con los datos de su entrega y, si ya
        regresó, los de su devolución. La usan
        `GET /equipments/{id}/history` y `GET /employees/{id}/equipments`.
      properties:
        delivery_document_detail_id:
          type: integer
          description: |
            Detalle de la entrega. Es el valor que se envía como
            `delivery_document_detail_id` al registrar la devolución.
          example: 1
        delivery_document_id:
          type: integer
          example: 1
        delivery_date:
          type: string
          description: Fecha de la entrega, formateada con `d-m-Y h:m:s A`.
          example: 04-09-2026 10:09:33 AM
        location:
          type: string
          description: Planta de la entrega, ya traducida.
          example: Planta Tejar
        employee_id:
          type: integer
          example: 3
        employee_name:
          type: string
          example: Roberto Santizo
        employee_department:
          type: string
          example: Tecnología de la Información
        equipment_id:
          type: integer
          example: 1
        equipment_name:
          type: string
          example: Laptop Dell Latitude
        equipment_brand:
          type: string
          example: Dell
        equipment_model:
          type: string
          example: Latitude 5440
        equipment_serie:
          type: string
          example: 5CD1234XYZ
        equipment_type:
          allOf:
            - $ref: '#/components/schemas/EquipmentType'
          description: Tipo del equipo, tal como está en `equipments.type`.
        observations:
          type: string
          nullable: true
          description: Observaciones registradas al entregar el equipo.
          example: Se entrega sin cargador
        returned:
          type: boolean
          description: |
            `true` cuando el detalle ya tiene su devolución registrada. Mientras
            sea `false` el equipo sigue asignado al empleado.
          example: false
        return_document_id:
          type: integer
          nullable: true
          example: null
        return_date:
          type: string
          nullable: true
          description: Fecha de la devolución, formateada con `d-m-Y h:m:s A`.
          example: null
        return_observations:
          type: string
          nullable: true
          description: Observaciones registradas al devolver el equipo.
          example: null

    ReturnDocument:
      type: object
      description: |
        Documento de devolución tal como lo emite `ReturnDocumentResource`. Los
        datos del empleado y la planta se leen a través del documento de entrega
        relacionado: la tabla `return_documents` no los guarda.
      properties:
        id:
          type: integer
          example: 1
        return_date:
          type: string
          description: |
            Fecha y hora de la devolución, formateada con `d-m-Y h:m:s A` (la
            asigna el servidor).
          example: 06-09-2026 09:15:02 AM
        responsable_signature:
          type: string
          description: Ruta relativa de la firma del responsable en el disco `public`.
          example: signatures/7c1e9d4a-5b2f-4e8a-9c3d-1f2a3b4c5d6e.png
        administrador_signature:
          type: string
          description: Ruta relativa de la firma del administrador en el disco `public`.
          example: signatures/8d2f0e5b-6c3a-4f9b-8d4e-2a3b4c5d6e7f.png
        employee_id:
          type: integer
          description: Empleado de la entrega relacionada.
          example: 3
        employee_name:
          type: string
          example: Roberto Santizo
        employee_department:
          type: string
          example: Tecnología de la Información
        location:
          type: string
          description: Planta de la entrega relacionada, ya traducida.
          example: Planta Tejar
        observations:
          type: string
          nullable: true
          example: Devuelve únicamente el mouse
        delivery_document_id:
          type: integer
          example: 1
        delivery_document_status:
          type: string
          description: |
            Estado en que queda la entrega tras esta devolución: `pendiente`
            (nada devuelto), `parcial` (falta equipo) o `devuelto` (todo
            devuelto).
          enum: [pendiente, parcial, devuelto]
          example: parcial
        user_id:
          type: integer
          description: Usuario que registró la devolución, tomado del token.
          example: 1
        user_name:
          type: string
          example: Administrador
        items:
          type: array
          description: Equipos devueltos en este documento.
          items:
            $ref: '#/components/schemas/ReturnDocumentDetail'

    ReturnDocumentDetail:
      type: object
      description: |
        Equipo devuelto, tal como lo emite `ReturnDocumentDetailResource`. Los
        datos del equipo se leen a través del detalle de entrega del que
        proviene.
      properties:
        id:
          type: integer
          example: 1
        return_document_id:
          type: integer
          example: 1
        delivery_document_detail_id:
          type: integer
          description: Detalle de la entrega que se está devolviendo.
          example: 2
        equipment_id:
          type: integer
          example: 2
        equipment_name:
          type: string
          example: Mouse Dell
        equipment_brand:
          type: string
          example: Dell
        equipment_model:
          type: string
          example: MS116
        equipment_serie:
          type: string
          example: MS1234XYZ
        equipment_type:
          allOf:
            - $ref: '#/components/schemas/EquipmentType'
          description: Tipo del equipo devuelto.
        is_used:
          type: string
          enum: [Usado, Nuevo]
          example: Nuevo
        original:
          type: string
          enum: [Original, Copia]
          example: Original
        observations:
          type: string
          nullable: true
          description: Observaciones del equipo al devolverlo.
          example: Regresa en buen estado

    ReturnDocumentRequest:
      type: object
      description: |
        Cuerpo `multipart/form-data` aceptado por `POST /return_documents`
        (`App\Http\Requests\CreateReturnDocumentRequest`). Los items se envían
        con la notación de arreglo de formularios:
        `items[0][delivery_document_detail_id]`, `items[0][observations]`, …

        `user_id` y `return_date` los asigna el servidor y **no se aceptan aquí**.
      required: [responsable_signature, administrador_signature, delivery_document_id, items]
      properties:
        responsable_signature:
          type: string
          format: binary
          description: |
            Firma del responsable. Reglas
            `required|file|mimes:png,jpg,jpeg|max:2048` (2 MB).
        administrador_signature:
          type: string
          format: binary
          description: |
            Firma del administrador. Reglas `required|mimes:png,jpg,jpeg|max:2048`
            (2 MB).
        delivery_document_id:
          type: integer
          description: |
            Entrega que se está devolviendo. Reglas
            `required|exists:delivery_documents,id`.
          example: 1
        observations:
          type: string
          nullable: true
          description: Observaciones generales de la devolución. Regla `nullable`.
          example: Devuelve únicamente el mouse
        items:
          type: array
          minItems: 1
          description: |
            Equipos que regresan. Reglas `required|array|min:1`. Para una
            devolución parcial se envían sólo algunos de los detalles
            pendientes.
          items:
            type: object
            required: [delivery_document_detail_id]
            properties:
              delivery_document_detail_id:
                type: integer
                description: |
                  Detalle de la entrega que regresa, obtenido de
                  `GET /delivery_documents/{id}/pending_items`. Reglas
                  `required|exists:delivery_document_details,id`.
                example: 2
              observations:
                type: string
                nullable: true
                description: Observaciones de este equipo. Regla `nullable`.
                example: Regresa en buen estado

    ReturnDocumentDetailRequest:
      type: object
      description: |
        Cuerpo aceptado por `POST /return_document_details`
        (`App\Http\Requests\CreateReturnDocumentDetailRequest`), para agregar un
        equipo a una devolución ya existente.
      required: [return_document_id, delivery_document_detail_id]
      properties:
        return_document_id:
          type: integer
          description: |
            Devolución a la que pertenece. Reglas
            `required|exists:return_documents,id`.
          example: 1
        delivery_document_detail_id:
          type: integer
          description: |
            Detalle de la entrega que regresa. Reglas
            `required|exists:delivery_document_details,id`.
          example: 2
        observations:
          type: string
          nullable: true
          description: Observaciones de este equipo. Regla `nullable`.
          example: Regresa en buen estado

    ObservationsRequest:
      type: object
      description: |
        Cuerpo de las correcciones sobre documentos ya firmados
        (`UpdateDeliveryDocumentDetailRequest`, `UpdateReturnDocumentRequest` y
        `UpdateReturnDocumentDetailRequest`): sólo se aceptan las observaciones.
      properties:
        observations:
          type: string
          nullable: true
          description: Reglas `nullable|string`.
          example: Se corrige la observación original

    DeliveryDocumentUpdateRequest:
      type: object
      description: |
        Cuerpo aceptado por `PUT /delivery_documents/{id}`
        (`App\Http\Requests\UpdateDeliveryDocumentRequest`). De un documento ya
        firmado sólo se corrigen la planta y las observaciones.
      required: [location]
      properties:
        location:
          type: integer
          description: Planta de la entrega. Reglas `required|integer`.
          example: 1
        observations:
          type: string
          nullable: true
          description: Reglas `nullable|string`.
          example: Se corrige la planta de la entrega

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador del recurso.
      schema:
        type: integer
        example: 1

  responses:

    ValidationError:
      description: Los datos enviados no pasaron la validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    NameRequiredError:
      description: |
        El campo `name` no pasó la validación de `BrandRequest` / `DepartmentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            faltante:
              summary: No se envió name
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
            demasiadoLargo:
              summary: name supera los 255 caracteres
              value:
                message: El nombre no puede tener más de 255 caracteres.
                errors:
                  name: ['El nombre no puede tener más de 255 caracteres.']

    BrandNotFound:
      description: No existe una marca con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Marca no encontrada
            data: null

    DepartmentNotFound:
      description: No existe un departamento con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Departamento no encontrado
            data: null

    EquipmentNotFound:
      description: No existe un equipo con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Equipo no encontrado
            data: null

    CaracteristicNotFound:
      description: No existe una característica con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Característica no encontrada
            data: null

    EquipmentValidationError:
      description: |
        El cuerpo no pasó la validación de `EquipmentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
                  model: ['El campo de modelo es obligatorio.']
                  brand_id: ['El campo de marca es obligatorio.']
                  serie: ['El campo de serie es obligatorio.']
                  original: ['El campo de original es obligatorio.']
                  is_used: ['El campo de usado es obligatorio.']
                  type: ['El campo de tipo es obligatorio.']
            marcaInexistente:
              summary: brand_id no corresponde a ninguna marca
              value:
                message: La marca seleccionada no existe.
                errors:
                  brand_id: ['La marca seleccionada no existe.']
            tipoInvalido:
              summary: type fuera del enum EquipmentType
              value:
                message: El tipo de equipo seleccionado no es válido.
                errors:
                  type: ['El tipo de equipo seleccionado no es válido.']
            booleanoInvalido:
              summary: original o is_used no son booleanos
              value:
                message: El campo de original debe ser verdadero o falso.
                errors:
                  original: ['El campo de original debe ser verdadero o falso.']
                  is_used: ['El campo de usado debe ser verdadero o falso.']

    CaracteristicValidationError:
      description: |
        El cuerpo no pasó la validación de `CaracteristicRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: El campo de nombre es obligatorio.
                errors:
                  name: ['El campo de nombre es obligatorio.']
                  description: ['El campo de descripción es obligatorio.']
                  equipment_id: ['El campo de equipo es obligatorio.']
            equipoInexistente:
              summary: equipment_id no corresponde a ningún equipo
              value:
                message: El equipo seleccionado no existe.
                errors:
                  equipment_id: ['El equipo seleccionado no existe.']

    CaracteristicFilterError:
      description: |
        El filtro `equipmentId` no pasó la validación de
        `CaracteristicIndexRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            equipoInexistente:
              summary: equipmentId no corresponde a ningún equipo
              value:
                message: El equipo seleccionado no existe.
                errors:
                  equipmentId: ['El equipo seleccionado no existe.']
            noNumerico:
              summary: equipmentId no es un número
              value:
                message: El equipo debe ser un identificador numérico.
                errors:
                  equipmentId: ['El equipo debe ser un identificador numérico.']

    EmployeeValidationError:
      description: |
        El cuerpo no pasó la validación en línea de `EmployeeController`. Los
        mensajes son los predeterminados de Laravel porque este recurso todavía no
        usa un FormRequest con `messages()` en español.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: The name field is required. (and 2 more errors)
                errors:
                  name: ['The name field is required.']
                  code: ['The code field is required.']
                  department_id: ['The department id field is required.']
            departamentoInexistente:
              summary: department_id no corresponde a ningún departamento
              value:
                message: The selected department id is invalid.
                errors:
                  department_id: ['The selected department id is invalid.']

    DeliveryDocumentNotFound:
      description: No existe un documento de entrega con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Documento de Entrega no encontrado
            data: null

    DeliveryDocumentDetailNotFound:
      description: No existe un detalle con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Detalles de Documento de Entrega no encontrado
            data: null

    DeliveryDocumentValidationError:
      description: |
        El cuerpo no pasó la validación de `CreateDeliveryDocumentRequest`. Sólo
        `location` tiene mensaje en español (`messages()`); el resto salen con el
        texto predeterminado de Laravel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: La planta es requerida
                errors:
                  location: ['La planta es requerida']
                  responsable_signature: ['The responsable signature field is required.']
                  administrador_signature: ['The administrador signature field is required.']
                  employee_id: ['The employee id field is required.']
                  items: ['The items field is required.']
            sinItems:
              summary: Se envió items vacío
              value:
                message: The items field must have at least 1 items.
                errors:
                  items: ['The items field must have at least 1 items.']
            equipoInexistente:
              summary: Un item apunta a un equipo que no existe
              value:
                message: The selected items.0.equipment_id is invalid.
                errors:
                  items.0.equipment_id: ['The selected items.0.equipment_id is invalid.']
            firmaInvalida:
              summary: La firma no es una imagen aceptada o pesa más de 2 MB
              value:
                message: 'The responsable signature field must be a file of type: png, jpg, jpeg.'
                errors:
                  responsable_signature: ['The responsable signature field must be a file of type: png, jpg, jpeg.']

    DeliveryDocumentDetailValidationError:
      description: |
        El cuerpo no pasó la validación de `CreateDeliveryDocumentDetailRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: El documento de entrega es requerido
                errors:
                  delivery_document_id: ['El documento de entrega es requerido']
                  equipment_id: ['El equipo es requerido']
            documentoInexistente:
              summary: delivery_document_id no corresponde a ningún documento
              value:
                message: El documento de entrega seleccionado no existe
                errors:
                  delivery_document_id: ['El documento de entrega seleccionado no existe']

    SignatureUploadError:
      description: |
        Una de las firmas no se pudo guardar (`BadRequestError` lanzado por
        `App\Services\Storage\ImageStorageService`). Se comprueba después de la
        validación del FormRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            archivoInvalido:
              summary: La subida llegó corrupta o incompleta
              value:
                statusCode: 400
                message: El archivo enviado no es válido
                data: null
            formatoNoSoportado:
              summary: El archivo no es una imagen aceptada
              value:
                statusCode: 400
                message: El archivo debe ser una imagen JPG, PNG o WEBP
                data: null
            noSePudoGuardar:
              summary: Falló la escritura en el disco
              value:
                statusCode: 400
                message: No se pudo guardar la imagen
                data: null

    Unauthenticated:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Token not provided
          examples:
            sinToken:
              summary: No se envió la cabecera Authorization
              value:
                message: Token not provided
            expirado:
              summary: Token expirado
              value:
                message: Token has expired

    Forbidden:
      description: |
        El usuario está autenticado pero no tiene el rol requerido
        (respuesta del middleware `admin` vía `UnauthorizedError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: No autorizado
            data: null

    ServerError:
      description: Error inesperado en el servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Server Error
            data: null

    EmployeeNotFound:
      description: No existe un empleado con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Empleado no encontrado
            data: null

    ReturnDocumentNotFound:
      description: No existe una devolución con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Devolución de Documento no encontrada
            data: null

    ReturnDocumentDetailNotFound:
      description: No existe un detalle de devolución con ese `id` (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Detalles de Devolución de Documentos no encontrados
            data: null

    EquipmentFilterError:
      description: |
        Los filtros de `GET /equipments/available` no pasaron la validación de
        `EquipmentAvailableRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: El tipo de equipo seleccionado no es válido.
            errors:
              type: ['El tipo de equipo seleccionado no es válido.']

    DeliveryDocumentFilterError:
      description: |
        Los filtros de `GET /delivery_documents` no pasaron la validación de
        `DeliveryDocumentIndexRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            estadoInvalido:
              summary: status fuera de la lista permitida
              value:
                message: El estado debe ser pendiente, parcial, devuelto o activo
                errors:
                  status: ['El estado debe ser pendiente, parcial, devuelto o activo']
            empleadoInexistente:
              summary: employeeId no corresponde a ningún empleado
              value:
                message: El empleado seleccionado no existe
                errors:
                  employeeId: ['El empleado seleccionado no existe']

    ReturnDocumentFilterError:
      description: |
        Los filtros de `GET /return_documents` no pasaron la validación de
        `ReturnDocumentIndexRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: El documento de entrega seleccionado no existe
            errors:
              deliveryDocumentId: ['El documento de entrega seleccionado no existe']

    ReturnDocumentValidationError:
      description: |
        El cuerpo no pasó la validación de `CreateReturnDocumentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            camposFaltantes:
              summary: No se enviaron los campos obligatorios
              value:
                message: La firma del responsable es requerida
                errors:
                  responsable_signature: ['La firma del responsable es requerida']
                  administrador_signature: ['La firma del administrador es requerida']
                  delivery_document_id: ['El documento de entrega es requerido']
                  items: ['Debe devolver al menos un equipo']
            detalleInexistente:
              summary: Un item apunta a un detalle de entrega que no existe
              value:
                message: El detalle de entrega seleccionado no existe
                errors:
                  items.0.delivery_document_detail_id: ['El detalle de entrega seleccionado no existe']

    ReturnDocumentDetailValidationError:
      description: |
        El cuerpo no pasó la validación de `CreateReturnDocumentDetailRequest`.
        Este FormRequest no define `messages()`, así que los textos son los
        predeterminados de Laravel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: The return document id field is required. (and 1 more error)
            errors:
              return_document_id: ['The return document id field is required.']
              delivery_document_detail_id: ['The delivery document detail id field is required.']

    DeliveryDocumentUpdateValidationError:
      description: |
        El cuerpo no pasó la validación de `UpdateDeliveryDocumentRequest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: La planta es requerida
            errors:
              location: ['La planta es requerida']

    NotAcceptableDeliveryDocumentDelete:
