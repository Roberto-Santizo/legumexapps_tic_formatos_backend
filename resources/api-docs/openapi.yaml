      summary: Corregir el encabezado de un documento de entrega
      description: |
        De un documento ya firmado **sólo se corrigen la planta y las
        observaciones**: las firmas, la fecha de entrega, el empleado y el
        usuario que registró quedan fijos. Para cambiar los equipos entregados
        se usan las rutas de `/delivery_document_details`.

        Ruta: `PUT /api/delivery_documents/{id}` — protegida por el middleware `jwt.auth`.
