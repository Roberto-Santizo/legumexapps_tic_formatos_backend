    get:
      tags: [Documentos de Entrega]
      summary: Listar documentos de entrega
      description: |
        Devuelve todos los documentos de entrega con el empleado que recibió el
        equipo, el usuario que registró la entrega y el arreglo `items` con cada
        equipo entregado.

        Ruta: `GET /api/delivery_documents` — protegida por el middleware `jwt.auth`.
      operationId: listDeliveryDocuments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Documentos de entrega obtenidos correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Documentos de Entrega Obtenidos Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeliveryDocument'
              example:
                statusCode: 200
                message: Documentos de Entrega Obtenidos Correctamente
                data:
                  - id: 1
                    location: Planta Tejar
                    delivery_date: 04-09-2026 10:09:33 AM
                    responsable_signature: signatures/9f8a1c2e-4b7d-4c1a-9d2e-3f5a6b7c8d90.png
                    administrador_signature: signatures/2b7d4e6f-1a3c-4e5b-8d9f-0a1b2c3d4e5f.png
                    employee_id: 3
                    employee_name: Roberto Santizo
                    employee_department: Tecnología de la Información
                    user_id: 1
                    user_name: Administrador
                    observations: Entrega inicial de equipo
                    items:
                      - id: 1
                        equipment_id: 1
                        equipment_name: Laptop Dell Latitude
                        equipment_brand: Dell
                        equipment_model: Latitude 5440
                        equipment_serie: 5CD1234XYZ
                        is_used: Nuevo
                        original: Original
                        observations: Se entrega sin cargador
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Documentos de Entrega]
      summary: Crear un documento de entrega con sus equipos
      description: |
        Crea el documento de entrega **y todos sus detalles en una sola petición**,
        dentro de una transacción: si falla el guardado de algún equipo no se
        guarda nada.

        El cuerpo se envía como `multipart/form-data` porque incluye las dos firmas
        como archivo. Los equipos entregados viajan en el campo `items` con la
        notación de arreglo de formularios:

        ```
        location=1
        employee_id=3
        observations=Entrega inicial de equipo
        responsable_signature=<archivo>
        administrador_signature=<archivo>
        items[0][equipment_id]=1
        items[0][observations]=Se entrega sin cargador
        items[1][equipment_id]=2
        items[1][observations]=Con estuche
        ```

        Se exige **al menos un item**. `user_id` se toma del token y
        `delivery_date` de la hora del servidor; **no se aceptan en el cuerpo**.
        Las firmas se guardan en el disco `public`, dentro de `signatures/`, con un
        uuid como nombre; en las respuestas de lectura sólo aparece esa ruta
        relativa.

        La creación **no devuelve el documento**: `data` es `true`. Usa
        `GET /api/delivery_documents/{id}` para leerlo.

        Ruta: `POST /api/delivery_documents` — protegida por el middleware `jwt.auth`.
      operationId: createDeliveryDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryDocumentRequest'
            encoding:
              responsable_signature:
                contentType: image/png, image/jpeg
              administrador_signature:
                contentType: image/png, image/jpeg
      responses:
        '201':
          description: Documento de entrega creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Documento de Entregas Creado Correctamente
                      data:
                        type: boolean
                        example: true
              example:
                statusCode: 201
                message: Documento de Entregas Creado Correctamente
                data: true
        '400':
          $ref: '#/components/responses/SignatureUploadError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/DeliveryDocumentValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

