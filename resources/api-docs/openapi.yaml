        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 406
            message: No se puede dar de baja un equipo que está asignado
            data: null

    NotAcceptableEmployeeDelete:
      description: |
        RN-24: el empleado tiene equipo asignado y no se puede eliminar
