  /delivery_document_details:
    get:
      tags: [Detalles de Documento de Entrega]
      summary: Listar detalles de documentos de entrega
      description: |
        Devuelve los equipos entregados con los datos del equipo ya resueltos
        (marca, modelo, serie y estado). Acepta el filtro opcional
        `deliveryDocumentId` para limitar el listado a un documento.

        Ruta: `GET /api/delivery_document_details` — protegida por el middleware `jwt.auth`.
      operationId: listDeliveryDocumentDetails
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryDocumentId
          in: query
          required: false
          description: |
            Filtra los detalles por documento de entrega. No se valida: si el `id`
            no corresponde a ningún documento la respuesta es una lista vacía.
          schema:
            type: integer
            example: 1
        - name: equipmentId
          in: query
          required: false
          description: |
            Filtra los detalles de un equipo concreto. Tampoco se valida.
          schema:
            type: integer
            example: 1
        - name: pending
          in: query
          required: false
          description: |
            Con cualquier valor verdadero (`1`, `true`) deja sólo los detalles
            **sin devolución registrada**.
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Detalles obtenidos correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Detalles de Documento de Entregas Obtenidos Correctamente
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeliveryDocumentDetail'
              example:
                statusCode: 200
                message: Detalles de Documento de Entregas Obtenidos Correctamente
                data:
                  - id: 1
                    equipment_id: 1
                    equipment_name: Laptop Dell Latitude
                    equipment_brand: Dell
                    equipment_model: Latitude 5440
                    equipment_serie: 5CD1234XYZ
                    is_used: Nuevo
                    original: Original
                    observations: Se entrega sin cargador
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Detalles de Documento de Entrega]
      summary: Agregar un equipo a un documento de entrega
      description: |
        Agrega un equipo a un documento de entrega **ya existente**. Para crear el
        documento con todos sus equipos de una sola vez usa
        `POST /api/delivery_documents`.

        La respuesta devuelve el cuerpo validado, no el registro creado: no incluye
        el `id` real ni las marcas de tiempo.

        Ruta: `POST /api/delivery_document_details` — protegida por el middleware `jwt.auth`.
      operationId: createDeliveryDocumentDetail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDocumentDetailRequest'
            examples:
              default:
                summary: Equipo agregado a un documento existente
                value:
                  id: 1
                  delivery_document_id: 1
                  equipment_id: 2
                  observations: Con estuche
      responses:
        '201':
          description: Detalle creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: Detalles de Documento de Entregas Creado Correctamente
                      data:
                        $ref: '#/components/schemas/DeliveryDocumentDetailRequest'
              example:
                statusCode: 201
                message: Detalles de Documento de Entregas Creado Correctamente
                data:
                  id: 1
                  delivery_document_id: 1
                  equipment_id: 2
                  observations: Con estuche
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/DeliveryDocumentDetailValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

