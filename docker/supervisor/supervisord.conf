; Supervisor es el PID 1 del contenedor: mantiene vivos php-fpm, nginx, el
; worker de la cola y el scheduler. La base de datos es externa (DB_HOST).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Permite `docker exec <contenedor> supervisorctl status` para inspeccionar o
; reiniciar servicios sueltos dentro del contenedor.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; app-start espera a la base externa, migra, cachea config y luego exec php-fpm.
[program:php-fpm]
command=/usr/local/bin/app-start
priority=10
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/bin/bash -c "wait-for-app && exec /sbin/su-exec www-data php /var/www/html/artisan queue:work --tries=3 --max-time=3600"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/bash -c "wait-for-app && exec /sbin/su-exec www-data php /var/www/html/artisan schedule:work"
priority=40
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
